<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-texto="pagina.registro">Registro - Epsilon</title>
    <link rel="stylesheet" href="style.css" />
    <script src="idiomas.js"></script>
  </head>

  <body>
    <div class="login-container">
      <div style="text-align: center; margin-bottom: 25px">
        <a href="index.html">
          <img src="logo.png" alt="Epsilon" style="height: 90px" />
        </a>
      </div>

      <form id="registerForm">
        <input type="text" name="nombre" placeholder="Nombre" data-placeholder="registro.nombre" required />
        <input type="text" name="apellido" placeholder="Apellido" data-placeholder="registro.apellido" required />
        <input
          type="email"
          name="mail"
          placeholder="Correo Electrónico" data-placeholder="registro.mail"
          required
        />

        <input type="text" name="usuario" placeholder="Usuario" data-placeholder="registro.usuario" required />

        <input
          type="password"
          name="contrasenia"
          placeholder="Contraseña" data-placeholder="registro.contrasenia"
          required
        />
        <input type="password" placeholder="Confirmar Contraseña" data-placeholder="registro.confirmar" required />

        <input type="submit" value="Registrarse" data-valor="registro.registrarse" />
      </form>

      <div class="login-links">
        <a href="login.html" data-texto="registro.yaTengo"> Ya tengo una cuenta </a>
      </div>
    </div>

    <script>
      document
        .getElementById("registerForm")

        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const formData = new FormData(e.target);
          const data = Object.fromEntries(formData.entries());

          try {
            const response = await fetch(
              "http://localhost/Proyecto/ProyectoSyntropy/Usuarios/miApi/Registrar",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(data),
              },
            );

            const result = await response.json();
            if (response.ok) {
              window.location.href = "login.html";
            } else {
              console.error("Error en la respuesta del servidor:", result);
            }
          } catch (error) {
            console.error("Error de conexion:", error);
          }
        });
    </script>
  </body>
</html>
