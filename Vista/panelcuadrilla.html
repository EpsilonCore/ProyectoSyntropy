<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-texto="pagina.panelcuadrilla">Cuadrillas - Epsilon</title>

    <link rel="stylesheet" href="style.css" />
    <script src="idiomas.js"></script>
  </head>

  <body>
    <script>
      if (localStorage.getItem("logueado") !== "si") {
        window.location.href = "login.html";
      }

      if (
        !["Administrador", "Operario"].includes(
          (localStorage.getItem("rol") || "").trim(),
        )
      ) {
        window.location.href = "index.html";
      }
    </script>

    <header>
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Epsilon" />
        </a>
      </div>

      <div class="header-actions">
        <div id="usuario" class="usuario"></div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      </div>

      <nav id="menu">
        <ul>
          <li>
            <button
              class="link-button"
              data-rol="Administrador, Operario"
              data-texto="menu.gestion"
              onclick="window.location.href = 'gestion.html'"
            >
              Gestión
            </button>
          </li>

          <li>
            <button
              class="link-button"
              data-rol="Administrador, Operario"
              data-texto="menu.panelRutas"
              onclick="window.location.href = 'panelrutas.html'"
            >
              Panel Rutas
            </button>
          </li>

          <li>
            <button
              class="link-button"
              data-texto="menu.mapa"
              onclick="window.location.href = 'mapa.html'"
            >
              Mapa
            </button>
          </li>

          <li>
            <button
              class="link-button"
              data-texto="menu.estadisticas"
              onclick="window.location.href = 'estadisticas.html'"
            >
              Estadísticas
            </button>
          </li>

          <li>
            <button
              class="link-button"
              data-texto="menu.documentacion"
              onclick="window.location.href = 'documentacion.html'"
            >
              Documentación
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Estructura visual alineada al Panel Usuario -->
    <div class="pagina">
      <h2 data-texto="pcua.titulo">Cuadrillas</h2>
      <p data-texto="pcua.descripcion">
        Formá y administrá los equipos de recolectores.
      </p>

      <div class="panel">
        <button data-texto="pcua.crear" onclick="abrirModalCuadrilla()">
          Crear Cuadrilla
        </button>
      </div>

      <div id="cuadrillaMensaje" style="display: none; padding: 12px 16px; border-radius: 8px; margin-top: 16px; font-weight: 600;"></div>

      <div class="lista-panel">
        <h3 data-texto="pcua.listaTitulo">Lista de Cuadrillas</h3>
        <ul id="cuadrillaGrid" style="list-style: none; padding: 0; margin: 0;">
          <p data-texto="pcua.cargando">Cargando cuadrillas...</p>
        </ul>
      </div>
    </div>

    <!-- Modal: nueva cuadrilla alineada al estilo overlayCrearUsuarios -->
    <div class="overlay" id="cuadrillaModalFondo" onclick="cerrarModalCuadrillaFuera(event)">
      <div class="crear-usuario">
        <h3 data-texto="pcua.nueva">Nueva Cuadrilla</h3>

        <form id="formCrearCuadrilla" onsubmit="event.preventDefault(); crearCuadrilla();">
          <label for="cuadrillaNombre" data-texto="pcua.nombre">
            Nombre de la cuadrilla
          </label>
          <input
            type="text"
            id="cuadrillaNombre"
            data-placeholder="pcua.nombreEjemplo"
            placeholder="Ej: Cuadrilla Norte"
            required
          />

          <label data-texto="pcua.miembros">Miembros (Recolectores activos)</label>
          <div id="cuadrillaListaRecolectores" style="max-height: 180px; overflow-y: auto; border: 1px solid var(--borde); border-radius: 8px; padding: 10px; margin-top: 6px; background: white;">
            <p style="color: var(--tinta-suave); font-size: 0.9rem;" data-texto="pcua.cargandoRecolectores">Cargando recolectores...</p>
          </div>

          <button
            type="submit"
            id="cuadrillaBtnGuardar"
            class="btn-crear-usuario"
            data-texto="pcua.crear"
          >
            Crear Cuadrilla
          </button>
          <button
            type="button"
            class="btn-cancelar-usuario"
            data-texto="comun.cancelar"
            onclick="cerrarModalCuadrilla()"
          >
            Cancelar
          </button>
        </form>
      </div>
    </div>

    <!-- Modal: asignar camión a una cuadrilla -->
    <div class="overlay" id="modalAsignarCamionFondo" onclick="cerrarModalAsignarCamionFuera(event)">
      <div class="crear-usuario">
        <h3 data-texto="pcua.asignarCamion">Asignar Camión</h3>
        <p id="asignarCamionCuadrillaNombre" style="color: var(--tinta-suave); margin-top: -8px;"></p>

        <form id="formAsignarCamion" onsubmit="event.preventDefault(); asignarCamion();">
          <label for="selectCamionDisponible" data-texto="pcua.camionDisponible">
            Camión disponible
          </label>
          <select id="selectCamionDisponible" required>
            <option value="" data-texto="pcua.cargandoCamiones">Cargando camiones...</option>
          </select>

          <button
            type="submit"
            id="btnGuardarAsignarCamion"
            class="btn-crear-usuario"
            data-texto="pcua.asignar"
          >
            Asignar
          </button>
          <button
            type="button"
            class="btn-cancelar-usuario"
            data-texto="comun.cancelar"
            onclick="cerrarModalAsignarCamion()"
          >
            Cancelar
          </button>
        </form>
      </div>
    </div>

    <script>
      // Rutas REST expuestas por APIGestion.php.
      const CUADRILLA_API_BASE = "/Proyecto/ProyectoSyntropy/Gestion/miApi/Cuadrillas";

      document.addEventListener("DOMContentLoaded", () => {
        const rolUsuario = (localStorage.getItem("rol") || "").trim();
        document.querySelectorAll("[data-rol]").forEach((boton) => {
          const rolesPermitidos = boton.dataset.rol
            .split(",")
            .map((rol) => rol.trim());
          if (!rolesPermitidos.includes(rolUsuario)) {
            boton.style.display = "none";
          }
        });

        cargarCuadrillas();
      });

      function toggleMenu() {
        document.getElementById("menu").classList.toggle("activo");
      }

      function cerrarSesion() {
        localStorage.removeItem("logueado");
        localStorage.removeItem("nickname");
        window.location.href = "index.html";
      }

      function cargarUsuario() {
        const nombre = localStorage.getItem("nickname") || traducir("usuario.porDefecto");
        const inicial = nombre.charAt(0).toUpperCase();

        document.getElementById("usuario").innerHTML = `
          <span class="nombre-usuario">${nombre}</span>
          <button class="usuario-btn" onclick="abrirUsuario()">
              ${inicial}
          </button>
          <div id="menuUsuario" class="menu-usuario">
              <button onclick="cerrarSesion()">${traducir("usuario.cerrarSesion")}</button>
          </div>
        `;
      }

      function abrirUsuario() {
        document.getElementById("menuUsuario").classList.toggle("activo");
      }

      cargarUsuario();

      function alCambiarIdioma() {
        cargarUsuario();
        if (cuadrillasCargadas) renderizarCuadrillas(cuadrillasCargadas);
      }

      // ---------- Lógica de Cuadrillas ----------

      function mostrarMensaje(texto, tipo) {
        const contenedor = document.getElementById("cuadrillaMensaje");
        contenedor.textContent = texto;
        contenedor.style.display = "block";
        contenedor.style.backgroundColor = tipo === "ok" ? "rgba(16, 185, 129, 0.12)" : "rgba(239, 68, 68, 0.12)";
        contenedor.style.color = tipo === "ok" ? "#047857" : "#b91c1c";
        
        setTimeout(() => {
          contenedor.style.display = "none";
        }, 4000);
      }

      let cuadrillasCargadas = null;

      async function cargarCuadrillas() {
        const grid = document.getElementById("cuadrillaGrid");
        grid.innerHTML = `<p style="color: var(--tinta-suave);">${traducir("pcua.cargando")}</p>`;

        try {
          const resp = await fetch(`${CUADRILLA_API_BASE}/Cuadrillas`);
          const json = await resp.json();

          if (!resp.ok || json.status !== "ok") {
            grid.innerHTML = "";
            mostrarMensaje(mensajeStatus(json), "error");
            return;
          }

          renderizarCuadrillas(json.data || []);
        } catch (error) {
          grid.innerHTML = "";
          mostrarMensaje(traducir("comun.conexion"), "error");
        }
      }

      function renderizarCuadrillas(cuadrillas) {
        cuadrillasCargadas = cuadrillas;
        const grid = document.getElementById("cuadrillaGrid");

        if (!cuadrillas.length) {
          grid.innerHTML = `<p style="color: var(--tinta-suave);">${traducir("pcua.vacio")}</p>`;
          return;
        }

        grid.innerHTML = cuadrillas
          .map((cuadrilla) => {
            const miembrosHtml = (cuadrilla.miembros || []).length
              ? cuadrilla.miembros
                  .map((m) => `<li>• ${m.nombre} ${m.apellido} (${m.nickname})</li>`)
                  .join("")
              : `<li>${traducir("pcua.sinMiembros")}</li>`;

            const camionInfo = cuadrilla.camion_matricula
              ? `${traducir("pcua.camionAsignado")}: <strong>${cuadrilla.camion_matricula}</strong>`
              : traducir("pcua.sinCamion");

            // Si ya tiene un camión, no se ofrece asignar otro: la API de
            // camiones disponibles solo devuelve los libres, así que abrir
            // el modal para una cuadrilla que ya tiene uno mostraría la
            // lista vacía sin explicación.
            const botonAsignarCamion = cuadrilla.camion_matricula
              ? ""
              : `<button
                  class="btn-asignar-camion"
                  onclick="abrirModalAsignarCamion(${cuadrilla.ID_cuadrilla}, '${cuadrilla.nombre.replace(/'/g, "\\'")}', event)">
                  ${traducir("pcua.asignarCamion")}
                </button>`;

            return `
              <li class="usuario-item" style="align-items: flex-start;">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                  <strong style="font-size: 1.1rem; color: var(--tinta);">${cuadrilla.nombre}</strong>
                  <span style="font-size: 0.85rem; color: var(--tinta-suave);">${traducir("pcua.creada")}: ${cuadrilla.fecha_creacion}</span>
                  <span style="font-size: 0.9rem; color: var(--tinta);">${camionInfo}</span>
                  <ul style="list-style: none; padding-left: 0; margin-top: 4px; font-size: 0.95rem; color: var(--tinta);">
                    ${miembrosHtml}
                  </ul>
                </div>
                <span class="usuario-acciones" style="display: flex; gap: 8px;">
                  ${botonAsignarCamion}
                  <button 
                    class="btn-eliminar" 
                    style="color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;"
                    onclick="eliminarCuadrilla(${cuadrilla.ID_cuadrilla}, '${cuadrilla.nombre.replace(/'/g, "\\'")}')">
                    ${traducir("comun.eliminar")}
                  </button>
                </span>
              </li>
            `;
          })
          .join("");
      }

      async function abrirModalCuadrilla() {
        document.getElementById("cuadrillaNombre").value = "";
        document.getElementById("cuadrillaModalFondo").classList.add("activo");

        const lista = document.getElementById("cuadrillaListaRecolectores");
        lista.innerHTML = `<p style="color: var(--tinta-suave); font-size: 0.9rem;">${traducir("pcua.cargandoRecolectores")}</p>`;

        try {
          const resp = await fetch(`${CUADRILLA_API_BASE}/Recolectores`);
          const json = await resp.json();

          if (!resp.ok || json.status !== "ok" || !(json.data || []).length) {
            lista.innerHTML = `<p style="color: var(--tinta-suave); font-size: 0.9rem;">${traducir("pcua.sinRecolectores")}</p>`;
            return;
          }

          lista.innerHTML = json.data
            .map(
              (r) => `
              <label style="display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; color: var(--tinta);">
                <input type="checkbox" value="${r.mail}" style="width: auto; margin: 0;" />
                <span>${r.nombre} ${r.apellido} (${r.nickname})</span>
              </label>
            `,
            )
            .join("");
        } catch (error) {
          lista.innerHTML = `<p style="color: var(--tinta-suave); font-size: 0.9rem;">${traducir("comun.conexion")}</p>`;
        }
      }

      function cerrarModalCuadrilla() {
        document.getElementById("cuadrillaModalFondo").classList.remove("activo");
      }
      
      function cerrarModalCuadrillaFuera(evento) {
        if (evento.target.id === "cuadrillaModalFondo") {
          cerrarModalCuadrilla();
        }
      }

      // ---------- Lógica de Asignar Camión ----------

      let idCuadrillaParaAsignarCamion = null;

      async function abrirModalAsignarCamion(idCuadrilla, nombreCuadrilla, event) {
        if (event) event.stopPropagation();

        idCuadrillaParaAsignarCamion = idCuadrilla;
        document.getElementById("asignarCamionCuadrillaNombre").textContent = traducir("pcua.tituloCamion").replace("{x}", nombreCuadrilla);
        document.getElementById("modalAsignarCamionFondo").classList.add("activo");

        const select = document.getElementById("selectCamionDisponible");
        select.innerHTML = `<option value="">${traducir("pcua.cargandoCamiones")}</option>`;

        try {
          const resp = await fetch(`${CUADRILLA_API_BASE}/CamionesDisponibles`);
          const json = await resp.json();

          if (!resp.ok || json.status !== "ok") {
            select.innerHTML = `<option value="">${mensajeStatus(json)}</option>`;
            return;
          }

          if (!(json.data || []).length) {
            select.innerHTML = `<option value="">${traducir("pcua.sinCamiones")}</option>`;
            return;
          }

          select.innerHTML =
            `<option value="">${traducir("pcua.seleccioneCamion")}</option>` +
            json.data
              .map((c) => `<option value="${c.matricula}">${c.matricula} — ${c.tipo}</option>`)
              .join("");
        } catch (error) {
          select.innerHTML = `<option value="">${traducir("comun.conexion")}</option>`;
        }
      }

      function cerrarModalAsignarCamion() {
        idCuadrillaParaAsignarCamion = null;
        document.getElementById("modalAsignarCamionFondo").classList.remove("activo");
        document.getElementById("formAsignarCamion").reset();
      }

      function cerrarModalAsignarCamionFuera(evento) {
        if (evento.target.id === "modalAsignarCamionFondo") {
          cerrarModalAsignarCamion();
        }
      }

      async function asignarCamion() {
        const matricula = document.getElementById("selectCamionDisponible").value;
        if (!matricula || !idCuadrillaParaAsignarCamion) {
          mostrarMensaje(traducir("pcua.faltaCamion"), "error");
          return;
        }

        const boton = document.getElementById("btnGuardarAsignarCamion");
        boton.disabled = true;
        boton.textContent = traducir("pcua.asignando");

        try {
          const resp = await fetch(`${CUADRILLA_API_BASE}/AsignarCamion`, {
            method: "PATCH",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              idCuadrilla: idCuadrillaParaAsignarCamion,
              matricula,
            }),
          });
          const json = await resp.json();

          if (resp.ok && json.status === "ok") {
            cerrarModalAsignarCamion();
            mostrarMensaje(traducir("pcua.okCamion"), "ok");
            cargarCuadrillas();
          } else {
            mostrarMensaje(mensajeStatus(json), "error");
          }
        } catch (error) {
          mostrarMensaje(traducir("comun.conexion"), "error");
        } finally {
          boton.disabled = false;
          boton.textContent = traducir("pcua.asignar");
        }
      }

      async function crearCuadrilla() {
        const nombre = document.getElementById("cuadrillaNombre").value.trim();
        const miembros = Array.from(
          document.querySelectorAll(
            "#cuadrillaListaRecolectores input[type=checkbox]:checked",
          ),
        ).map((chk) => chk.value);

        if (!nombre || !miembros.length) {
          mostrarMensaje(traducir("pcua.faltaDatos"), "error");
          return;
        }

        const boton = document.getElementById("cuadrillaBtnGuardar");
        boton.disabled = true;
        boton.textContent = traducir("pcua.creando");

        try {
          const resp = await fetch(`${CUADRILLA_API_BASE}/Registrar`, {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre, miembros }),
          });
          const json = await resp.json();

          if (resp.ok && json.status === "creado") {
            cerrarModalCuadrilla();
            mostrarMensaje(traducir("pcua.okCrear"), "ok");
            cargarCuadrillas();
          } else {
            mostrarMensaje(mensajeStatus(json), "error");
          }
        } catch (error) {
          mostrarMensaje(traducir("comun.conexion"), "error");
        } finally {
          boton.disabled = false;
          boton.textContent = traducir("pcua.crear");
        }
      }

      async function eliminarCuadrilla(idCuadrilla, nombre) {
        if (!confirm(traducir("pcua.confirmarEliminar").replace("{x}", nombre))) {
          return;
        }

        try {
          const resp = await fetch(`${CUADRILLA_API_BASE}/Borrar`, {
            method: "DELETE",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idCuadrilla }),
          });
          const json = await resp.json();

          if (resp.ok && json.status === "ok") {
            mostrarMensaje(traducir("pcua.okEliminar"), "ok");
            cargarCuadrillas();
          } else {
            mostrarMensaje(mensajeStatus(json), "error");
          }
        } catch (error) {
          mostrarMensaje(traducir("comun.conexion"), "error");
        }
      }
    </script>
  </body>
</html>
