<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-texto="pagina.panelrutas">Rutas - Epsilon</title>
    <link rel="stylesheet" href="style.css" />
    <script src="idiomas.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>

  <body>
    <script>
      {
        const rol = (localStorage.getItem("rol") || "").trim();
        const sinSesion = localStorage.getItem("logueado") !== "si";

        if (sinSesion || !["Administrador", "Operario"].includes(rol)) {
          document.documentElement.style.display = "none";
          window.location.replace(sinSesion ? "login.html" : "index.html");
        }
      }
    </script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <header>
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Epsilon" />
        </a>
      </div>

      <div class="header-actions">
        <div id="usuario" class="usuario"></div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      </div>

      <nav id="menu">
        <ul>
          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              data-texto="menu.gestion"
              onclick="window.location.href = 'gestion.html'"
            >
              Gestión
            </button>
          </li>

          <li>
            <button
              class="link-button"
              data-texto="menu.mapa"
              onclick="window.location.href = 'mapa.html'"
            >
              Mapa
            </button>
          </li>
          <li>
            <button
              class="link-button"
              data-texto="menu.estadisticas"
              onclick="window.location.href = 'estadisticas.html'"
            >
              Estadísticas
            </button>
          </li>
          <li>
            <button
              class="link-button"
              data-texto="menu.documentacion"
              onclick="window.location.href = 'documentacion.html'"
            >
              Documentación
            </button>
          </li>

          <li>
            <button
              class="link-button"
              onclick="cerrarSesion()"
              data-texto="usuario.cerrarSesion"
            >
              Cerrar Sesión
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <div class="pagina">
      <h2 data-texto="prut.titulo">Rutas</h2>
      <p data-texto="prut.descripcion">
        Planificación de recorridos de recolección.
      </p>

      <div class="panel">
        <button
          id="btnCrearRuta"
          data-texto="prut.crear"
          onclick="iniciarCreacionRuta()"
        >
          Crear Ruta
        </button>
      </div>

      <form id="formNuevaRuta" class="form-nueva-ruta">
        <input
          id="nombreRuta"
          data-placeholder="prut.nombre"
          placeholder="Nombre de la ruta"
          required
        />

        <select id="tipoRuta" required onchange="cambiarTipoRuta()">
          <option value="" disabled selected data-texto="comun.seleccioneTipo">
            Seleccione un tipo
          </option>
          <option value="Naranja" data-texto="tipoContenedor.Naranja">
            Naranja - Reciclables
          </option>
          <option value="Metalico" data-texto="tipoContenedor.Metalico">
            Metalico - Residuos mezclados
          </option>
          <option value="Plastico" data-texto="tipoContenedor.Plastico">
            Plastico - Residuos mezclados
          </option>
        </select>

        <select
          id="centroInicio"
          required
          onchange="redibujarParadas()"
        ></select>

        <select id="centroFin" required onchange="redibujarParadas()"></select>

        <button
          type="button"
          class="btn-crear-centro-acopio"
          data-texto="prut.sugerir"
          onclick="sugerirRuta()"
        >
          Sugerir ruta
        </button>

        <button
          type="submit"
          class="btn-crear-centro-acopio"
          data-texto="prut.guardar"
        >
          Guardar Ruta
        </button>
        <button
          type="button"
          class="btn-cancelar-centro-acopio"
          data-texto="comun.cancelar"
          onclick="cancelarCreacionRuta()"
        >
          Cancelar
        </button>
      </form>

      <p id="instruccionMapa" class="instruccion-mapa" style="display: none">
        <span data-texto="prut.instruccion">
          Hacé click sobre los contenedores (color según su estado) para
          agregarlos como paradas, en el orden en que el camión debe
          recorrerlos.
        </span>
        <span id="resumenRuta"></span>
      </p>

      <p id="avisoSugerencia" class="instruccion-mapa"></p>

      <div id="map"></div>

      <ul id="listaParadasRuta"></ul>

      <div
        id="camionesCompatibles"
        class="lista-panel"
        style="display: none"
      ></div>

      <div class="lista-panel">
        <h3 data-texto="prut.listaTitulo">Rutas guardadas</h3>
        <div id="listaRutas">
          <p data-texto="prut.cargando">Cargando rutas...</p>
        </div>
      </div>
    </div>

    <div id="modalAsignarCuadrilla" class="overlay">
      <div class="asignar-cuadrilla">
        <h3 data-texto="prut.modalTitulo">Asignar cuadrilla</h3>
        <p id="modalCuadrillaRutaNombre"></p>
        <form id="formAsignarCuadrilla">
          <select id="selectCuadrilla" required>
            <option value="" data-texto="prut.seleccioneCuadrilla">
              Seleccioná una cuadrilla
            </option>
          </select>
          <button
            type="submit"
            class="btn-crear-centro-acopio"
            data-texto="prut.asignar"
          >
            Asignar
          </button>
          <button
            type="button"
            class="btn-cancelar-centro-acopio"
            data-texto="comun.cancelar"
            onclick="cerrarModalCuadrilla()"
          >
            Cancelar
          </button>
        </form>
      </div>
    </div>

    <script>
      const API_URL =
        "http://localhost/Proyecto/ProyectoSyntropy/Recoleccion/miApi/";
      const API_URL_GESTION =
        "http://localhost/Proyecto/ProyectoSyntropy/Gestion/miApi/";

      const ICON_URL = "https://unpkg.com/lucide-static@latest/icons/";

      let modoCreacion = false;
      let paradas = [];
      let contenedoresDisponibles = [];
      let marcadoresContenedores = [];
      let lineaRuta = null;
      let lineaRutaContador = 0;
      let rutas = null;
      let rutaSeleccionada = null;
      let capaRutaSeleccionada = null;
      let capaRutaSeleccionadaContador = 0;
      let cuadrillasDisponibles = [];
      let idRutaParaAsignar = null;
      let centrosAcopio = [];
      let marcadoresCentros = [];
      let camionesDisponibles = [];

      const map = L.map("map").setView([-34.9011, -56.1645], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19,
      }).addTo(map);

      async function cargarContenedores() {
        try {
          const resp = await fetch(`${API_URL_GESTION}Contenedores`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          contenedoresDisponibles = (data?.data || []).filter(
            (c) => c.lat && c.lon,
          );
          dibujarContenedores();
        } catch (error) {
          console.error("Error al obtener contenedores:", error);
        }
      }

      async function cargarCentros() {
        try {
          const resp = await fetch(
            `${API_URL_GESTION}CentrosAcopio/CentrosAcopio`,
          );
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          centrosAcopio = (data?.data || []).filter((c) => c.lat && c.lon);
          llenarSelectCentros();
          if (modoCreacion) redibujarParadas();
        } catch (error) {
          console.error("Error al obtener centros de acopio:", error);
        }
      }

      async function cargarCamiones() {
        try {
          const resp = await fetch(
            `${API_URL_GESTION}Cuadrillas/CamionesDisponibles`,
          );
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          camionesDisponibles = data?.data || [];
          renderizarCamionesCompatibles();
        } catch (error) {
          console.error("Error al obtener camiones disponibles:", error);
        }
      }

      function colorPorEstadoContenedor(estado) {
        switch (estado) {
          case "Vacio":
            return "#6fcf97";
          case "Lleno":
            return "#eb5757";
          case "Desbordado":
            return "#a77fd6";
          case "Media capacidad":
            return "#f2c94c";
          default:
            return "#999999";
        }
      }

      function iconoContenedorHtml(estado) {
        return `<div style="width:24px;height:24px;border-radius:50%;background:${colorPorEstadoContenedor(estado)};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;box-sizing:border-box;"><img src="${ICON_URL}trash-2.svg" width="14" height="14" style="display:block;" alt="" /></div>`;
      }

      function dibujarContenedores() {
        marcadoresContenedores.forEach((m) => map.removeLayer(m));

        const tipoRuta = document.getElementById("tipoRuta").value;
        const contenedoresVisibles = modoCreacion
          ? contenedoresDisponibles.filter((c) => c.tipo === tipoRuta)
          : contenedoresDisponibles;

        marcadoresContenedores = contenedoresVisibles.map((cont) => {
          const indice = paradas.findIndex(
            (p) => p.idContenedor === cont.ID_contenedor,
          );
          const seleccionado = indice !== -1;

          const marker = L.marker([cont.lat, cont.lon], {
            icon: L.divIcon({
              className: "",
              html: seleccionado
                ? `<div class="numero-parada">${indice + 1}</div>`
                : iconoContenedorHtml(cont.estado),
              iconSize: [24, 24],
              iconAnchor: [12, 12],
            }),
          }).addTo(map);

          marker.bindTooltip(
            `${traducir("prut.contenedor")} #${cont.ID_contenedor} — ${cont.calle ?? ""} ${cont.numero ?? ""}, ${cont.barrio ?? ""} — ${cont.estado ? traducirValor("estado", cont.estado) : ""}`,
          );

          marker.on("click", () => {
            if (!modoCreacion) return;
            toggleParadaContenedor(cont);
          });

          return marker;
        });
      }

      function toggleParadaContenedor(cont) {
        const indice = paradas.findIndex(
          (p) => p.idContenedor === cont.ID_contenedor,
        );
        if (indice !== -1) {
          paradas.splice(indice, 1);
        } else {
          paradas.push({
            lat: cont.lat,
            lon: cont.lon,
            idContenedor: cont.ID_contenedor,
            calle: cont.calle,
            numero: cont.numero,
            capacidadCarga: cont.capacidadCarga,
          });
        }
        redibujarParadas();
      }

      function iniciarCreacionRuta() {
        modoCreacion = true;
        paradas = [];
        rutaSeleccionada = null;
        limpiarRutaSeleccionada();
        llenarSelectCentros();
        redibujarParadas();
        cargarContenedores();
        cargarCentros();
        cargarCamiones();

        document.getElementById("btnCrearRuta").style.display = "none";
        document.getElementById("formNuevaRuta").classList.add("activo");
        document.getElementById("instruccionMapa").style.display = "block";
      }

      function cancelarCreacionRuta() {
        modoCreacion = false;
        paradas = [];
        document.getElementById("formNuevaRuta").reset();
        document.getElementById("avisoSugerencia").textContent = "";
        llenarSelectCentros();
        redibujarParadas();

        document.getElementById("btnCrearRuta").style.display = "inline-block";
        document.getElementById("formNuevaRuta").classList.remove("activo");
        document.getElementById("instruccionMapa").style.display = "none";
      }

      function cambiarTipoRuta() {
        paradas = [];
        document.getElementById("avisoSugerencia").textContent = "";
        llenarSelectCentros();
        redibujarParadas();
      }

      function mismoTipo(tipoCentro, tipoRuta) {
        return (
          String(tipoCentro || "")
            .trim()
            .toLowerCase() ===
          String(tipoRuta || "")
            .trim()
            .toLowerCase()
        );
      }

      function llenarSelectCentros() {
        const tipo = document.getElementById("tipoRuta").value;
        const centros = centrosAcopio.filter((c) =>
          mismoTipo(c.tipoResiduo, tipo),
        );

        [
          { id: "centroInicio", clave: "prut.centroInicio" },
          { id: "centroFin", clave: "prut.centroFin" },
        ].forEach(({ id, clave }) => {
          const select = document.getElementById(id);
          const anterior = select.value;
          const textoVacio = !tipo
            ? "comun.seleccioneTipo"
            : centros.length === 0
              ? "prut.sinCentros"
              : clave;

          select.innerHTML =
            `<option value="" disabled selected>${traducir(textoVacio)}</option>` +
            centros
              .map(
                (c) =>
                  `<option value="${c.ID_acopio}">#${c.ID_acopio} — ${c.calle} ${c.numero}, ${c.barrio}</option>`,
              )
              .join("");
          select.value = anterior;
        });
      }

      function centroSeleccionado(idSelect) {
        const idCentro = document.getElementById(idSelect).value;
        return centrosAcopio.find((c) => String(c.ID_acopio) === idCentro);
      }

      function puntosDeRuta() {
        const inicio = centroSeleccionado("centroInicio");
        const fin = centroSeleccionado("centroFin");
        const aParada = (c) => ({
          lat: c.lat,
          lon: c.lon,
          idAcopio: c.ID_acopio,
        });

        return [
          ...(inicio ? [aParada(inicio)] : []),
          ...paradas,
          ...(fin ? [aParada(fin)] : []),
        ];
      }

      function quitarParada(indice) {
        paradas.splice(indice, 1);
        redibujarParadas();
      }

      function dibujarCentros() {
        marcadoresCentros.forEach((m) => map.removeLayer(m));
        marcadoresCentros = [];

        if (!modoCreacion) return;

        const tipo = document.getElementById("tipoRuta").value;
        const inicio = centroSeleccionado("centroInicio");
        const fin = centroSeleccionado("centroFin");
        const centrosVisibles = tipo
          ? centrosAcopio.filter((c) => mismoTipo(c.tipoResiduo, tipo))
          : centrosAcopio;

        centrosVisibles.forEach((centro) => {
          const esInicio = inicio && inicio.ID_acopio === centro.ID_acopio;
          const esFin = fin && fin.ID_acopio === centro.ID_acopio;
          const etiqueta =
            esInicio && esFin ? "I/F" : esInicio ? "I" : esFin ? "F" : "";

          const marker = L.marker([centro.lat, centro.lon], {
            icon: L.divIcon({
              className: "",
              html: `<div class="numero-parada" style="background:#c97a1e">${etiqueta}</div>`,
              iconSize: [24, 24],
              iconAnchor: [12, 12],
            }),
          }).addTo(map);
          marker.bindTooltip(
            `${traducir("prut.centroAcopio")} #${centro.ID_acopio} — ${centro.calle} ${centro.numero}, ${centro.barrio} — ${centro.tipoResiduo}`,
          );
          marker.on("click", () => elegirCentroEnMapa(centro));
          marcadoresCentros.push(marker);
        });
      }

      function elegirCentroEnMapa(centro) {
        const tipo = document.getElementById("tipoRuta").value;
        if (!tipo || !mismoTipo(centro.tipoResiduo, tipo)) {
          alert(traducir("prut.faltanCentros"));
          return;
        }

        const selectInicio = document.getElementById("centroInicio");
        const selectFin = document.getElementById("centroFin");

        if (!selectInicio.value) selectInicio.value = centro.ID_acopio;
        else selectFin.value = centro.ID_acopio;

        redibujarParadas();
      }

      function textoCentro(etiqueta, centro) {
        if (!centro) return "";
        return `<li><span>${traducir(etiqueta)}: ${traducir("prut.centroAcopio")} #${centro.ID_acopio} — ${centro.calle} ${centro.numero}</span></li>`;
      }

      function renderizarCamionesCompatibles() {
        const contenedor = document.getElementById("camionesCompatibles");

        if (paradas.length === 0) {
          contenedor.style.display = "none";
          contenedor.innerHTML = "";
          return;
        }

        const carga = paradas.reduce(
          (suma, p) => suma + Number(p.capacidadCarga),
          0,
        );
        const compatibles = camionesDisponibles.filter(
          (c) => Number(c.capacidadCarga) >= carga,
        );

        contenedor.style.display = "block";
        contenedor.innerHTML =
          `<h3>${traducir("prut.camionesTitulo")}</h3>` +
          `<p>${traducir("prut.cargaRuta").replace("{kg}", carga)}</p>` +
          (compatibles.length === 0
            ? `<p>${traducir("prut.sinCamionesCompatibles")}</p>`
            : "<ul>" +
              compatibles
                .map(
                  (c) =>
                    `<li>${c.matricula} — ${c.tipo} — ${c.capacidadCarga} kg</li>`,
                )
                .join("") +
              "</ul>");
      }

      function redibujarParadas() {
        dibujarContenedores();
        dibujarCentros();
        actualizarLineaRuta();
        renderizarCamionesCompatibles();

        document.getElementById("listaParadasRuta").innerHTML = modoCreacion
          ? textoCentro("prut.inicio", centroSeleccionado("centroInicio")) +
            paradas
              .map(
                (p, i) => `
          <li>
            <span>${i + 1}. ${traducir("prut.contenedor")} #${p.idContenedor} — ${p.calle ?? ""} ${p.numero ?? ""}</span>
            <button type="button" onclick="quitarParada(${i})">${traducir("prut.quitar")}</button>
          </li>`,
              )
              .join("") +
            textoCentro("prut.fin", centroSeleccionado("centroFin"))
          : "";
      }

      async function sugerirRuta() {
        const datos = {
          tipo: document.getElementById("tipoRuta").value,
          idAcopioInicio: document.getElementById("centroInicio").value,
          idAcopioFin: document.getElementById("centroFin").value,
        };

        if (!datos.tipo || !datos.idAcopioInicio || !datos.idAcopioFin) {
          alert(traducir("prut.faltanCentros"));
          return;
        }

        try {
          const resp = await fetch(`${API_URL}Rutas/Sugerir`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });
          const resultado = await resp.json();

          if (resultado.status === "ok") {
            paradas = resultado.data.contenedores.map((c) => ({
              lat: c.lat,
              lon: c.lon,
              idContenedor: c.ID_contenedor,
              calle: c.calle,
              numero: c.numero,
              capacidadCarga: c.capacidadCarga,
            }));
            document.getElementById("avisoSugerencia").textContent =
              resultado.data.dejadosFuera > 0
                ? traducir("prut.sugerenciaRecortada").replace(
                    "{n}",
                    resultado.data.dejadosFuera,
                  )
                : "";
            redibujarParadas();
          } else if (resultado.status === "sin_contenedores") {
            alert(traducir("prut.sinContenedores"));
          } else {
            alert(mensajeStatus(resultado));
          }
        } catch (error) {
          console.error("Error al sugerir la ruta:", error);
          alert(traducir("comun.conexion"));
        }
      }

      async function actualizarLineaRuta() {
        const contador = ++lineaRutaContador;

        if (lineaRuta) {
          map.removeLayer(lineaRuta);
          lineaRuta = null;
        }
        document.getElementById("resumenRuta").textContent = "";

        const puntos = puntosDeRuta().map(({ lat, lon }) => ({ lat, lon }));

        if (paradas.length === 0 || puntos.length < 2) return;

        try {
          const resp = await fetch(`${API_URL}Rutas/CalcularCamino`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paradas: puntos }),
          });
          const resultado = await resp.json();

          // Si mientras esperábamos se guardó, canceló o cambió la ruta,
          // esta respuesta ya está vieja: no la dibujamos.
          if (contador !== lineaRutaContador) return;

          if (resultado.status === "ok" && resultado.data) {
            const coordenadas = resultado.data.geometria.map((p) => [
              p.lat,
              p.lon,
            ]);
            lineaRuta = L.polyline(coordenadas, { color: "#2f8f3a" }).addTo(
              map,
            );

            const km = (resultado.data.distanciaMetros / 1000).toFixed(1);
            const min = Math.round(resultado.data.duracionSegundos / 60);
            document.getElementById("resumenRuta").textContent = traducir(
              "prut.resumen",
            )
              .replace("{km}", km)
              .replace("{min}", min);
            return;
          }
        } catch (error) {
          console.error("Error al calcular el camino por calles:", error);
        }

        if (contador !== lineaRutaContador) return;

        // línea recta punteada si OSRM no respondió.
        lineaRuta = L.polyline(
          puntos.map((p) => [p.lat, p.lon]),
          { color: "#2f8f3a", dashArray: "6 6" },
        ).addTo(map);
        document.getElementById("resumenRuta").textContent =
          traducir("prut.resumenRecta");
      }

      document
        .getElementById("formNuevaRuta")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          if (paradas.length < 1) {
            alert(traducir("prut.minimoParadas"));
            return;
          }

          const datos = {
            nombre: document.getElementById("nombreRuta").value,
            paradas: puntosDeRuta().map(
              ({ lat, lon, idContenedor, idAcopio }) => ({
                lat,
                lon,
                idContenedor,
                idAcopio,
              }),
            ),
          };

          const resp = await fetch(`${API_URL}Rutas/Registrar`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });

          const resultado = await resp.json();

          if (resultado.status === "creado") {
            cancelarCreacionRuta();
            obtenerRutas();
          } else {
            alert(mensajeStatus(resultado));
          }
        });

      function limpiarRutaSeleccionada() {
        capaRutaSeleccionadaContador++;
        if (capaRutaSeleccionada) {
          map.removeLayer(capaRutaSeleccionada);
          capaRutaSeleccionada = null;
        }
      }

      async function dibujarRutaSeleccionada(paradasRuta) {
        limpiarRutaSeleccionada();
        const contador = capaRutaSeleccionadaContador;

        if (paradasRuta.length === 0) return;

        const puntos = paradasRuta.map((p) => ({
          lat: parseFloat(p.lat),
          lon: parseFloat(p.lon),
        }));

        const capa = L.layerGroup().addTo(map);

        puntos.forEach((p, i) => {
          L.marker([p.lat, p.lon], {
            icon: L.divIcon({
              className: "",
              html: `<div class="numero-parada">${i + 1}</div>`,
              iconSize: [24, 24],
              iconAnchor: [12, 12],
            }),
          }).addTo(capa);
        });

        let coordenadasLinea = puntos.map((p) => [p.lat, p.lon]);

        if (puntos.length >= 2) {
          try {
            const resp = await fetch(`${API_URL}Rutas/CalcularCamino`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ paradas: puntos }),
            });
            const resultado = await resp.json();
            if (resultado.status === "ok" && resultado.data) {
              coordenadasLinea = resultado.data.geometria.map((p) => [
                p.lat,
                p.lon,
              ]);
            }
          } catch (error) {
            console.error("Error al calcular el camino por calles:", error);
          }
        }

        // Si mientras esperábamos se seleccionó otra ruta o se canceló,
        // esta respuesta ya está vieja: descartamos la capa sin mostrarla.
        if (contador !== capaRutaSeleccionadaContador) {
          map.removeLayer(capa);
          return;
        }

        L.polyline(coordenadasLinea, { color: "#c97a1e", weight: 4 }).addTo(
          capa,
        );

        capaRutaSeleccionada = capa;

        map.fitBounds(L.latLngBounds(puntos.map((p) => [p.lat, p.lon])), {
          padding: [40, 40],
        });
      }

      async function verRutaEnMapa(idRuta, event) {
        if (event) event.stopPropagation();
        if (modoCreacion) return;

        rutaSeleccionada = idRuta;
        renderizarListaRutas();

        try {
          const resp = await fetch(`${API_URL}Rutas/${idRuta}`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          await dibujarRutaSeleccionada(data?.data || []);
        } catch (error) {
          console.error("Error al obtener la ruta:", error);
          alert(traducir("op.errorRuta"));
        }
      }

      async function eliminarRuta(idRuta, event) {
        if (event) event.stopPropagation();

        if (!confirm(traducir("prut.confirmarEliminar"))) {
          return;
        }

        try {
          const resp = await fetch(`${API_URL}Rutas/Eliminar`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idRuta }),
          });
          const resultado = await resp.json();

          if (resultado.status === "ok") {
            if (rutaSeleccionada === idRuta) {
              rutaSeleccionada = null;
              limpiarRutaSeleccionada();
            }
            obtenerRutas();
          } else {
            alert(mensajeStatus(resultado));
          }
        } catch (error) {
          console.error("Error al eliminar la ruta:", error);
          alert(traducir("comun.conexion"));
        }
      }

      async function cargarCuadrillas() {
        try {
          const resp = await fetch(`${API_URL_GESTION}Cuadrillas/Cuadrillas`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          // Solo se puede asignar una ruta a cuadrillas que ya tienen un camión asignado.
          cuadrillasDisponibles = (data?.data || []).filter(
            (c) => c.camion_matricula,
          );
        } catch (error) {
          console.error("Error al obtener cuadrillas:", error);
        }
      }

      function abrirModalCuadrilla(idRuta, nombreRuta, event) {
        if (event) event.stopPropagation();

        idRutaParaAsignar = idRuta;
        document.getElementById("modalCuadrillaRutaNombre").textContent =
          traducir("prut.rutaNombre").replace("{x}", nombreRuta);

        const select = document.getElementById("selectCuadrilla");

        if (cuadrillasDisponibles.length === 0) {
          select.innerHTML = `<option value="">${traducir("prut.sinCuadrillas")}</option>`;
        } else {
          select.innerHTML =
            `<option value="">${traducir("prut.seleccioneCuadrilla")}</option>` +
            cuadrillasDisponibles
              .map(
                (c) =>
                  `<option value="${c.ID_cuadrilla}">${c.nombre || `${traducir("pcua.cuadrilla")} #${c.ID_cuadrilla}`} — ${traducir("pcam.camion")} ${c.camion_matricula}</option>`,
              )
              .join("");
        }

        document
          .getElementById("modalAsignarCuadrilla")
          .classList.add("activo");
      }

      function cerrarModalCuadrilla() {
        idRutaParaAsignar = null;
        document
          .getElementById("modalAsignarCuadrilla")
          .classList.remove("activo");
        document.getElementById("formAsignarCuadrilla").reset();
      }

      document
        .getElementById("formAsignarCuadrilla")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const idCuadrilla = document.getElementById("selectCuadrilla").value;
          if (!idCuadrilla || !idRutaParaAsignar) return;

          try {
            const resp = await fetch(`${API_URL}Rutas/AsignarCuadrilla`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                idRuta: idRutaParaAsignar,
                idCuadrilla,
              }),
            });
            const resultado = await resp.json();

            if (resultado.status === "ok") {
              cerrarModalCuadrilla();
              obtenerRutas();
            } else if (resultado.status === "sin_camion") {
              alert(traducir("prut.cuadrillaSinCamion"));
            } else {
              alert(mensajeStatus(resultado));
            }
          } catch (error) {
            console.error("Error al asignar cuadrilla:", error);
            alert(traducir("comun.conexion"));
          }
        });

      async function obtenerRutas() {
        try {
          const resp = await fetch(`${API_URL}Rutas`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          rutas = data?.data || [];
          renderizarListaRutas();
        } catch (error) {
          console.error("Error al obtener rutas:", error);
          document.getElementById("listaRutas").innerHTML =
            `<p>${traducir("prut.errorRutas")}</p>`;
        }
      }

      function renderizarListaRutas() {
        const contenedor = document.getElementById("listaRutas");
        if (rutas.length === 0) {
          contenedor.innerHTML = `<p>${traducir("prut.vacio")}</p>`;
          return;
        }
        contenedor.innerHTML =
          '<ul style="list-style: none; padding: 0; margin: 0;">' +
          rutas
            .map(
              (r) => `
            <li class="ruta-item${r.ID_ruta === rutaSeleccionada ? " seleccionada" : ""}"
                onclick="verRutaEnMapa(${r.ID_ruta}, event)">
              <div class="ruta-info">
                <strong>${r.nombre}</strong>
                — ${r.camion_matricula ? `${traducir("pcam.camion")} ${r.camion_matricula}` : traducir("prut.sinCamion")}
                — ${r.cuadrilla_nombre ? `${traducir("pcua.cuadrilla")} ${r.cuadrilla_nombre}` : traducir("prut.sinCuadrilla")}
                — ${r.cantidad_paradas} ${traducir("prut.paradas")}
                — ${traducirValor("estado", r.estado)}
              </div>
              <div class="ruta-acciones">
                <button
                  type="button"
                  class="btn-asignar-cuadrilla"
                  onclick="abrirModalCuadrilla(${r.ID_ruta}, '${(r.nombre || "").replace(/'/g, "\\'")}', event)"
                >
                  ${traducir("op.asignarCuadrilla")}
                </button>
                <button
                  type="button"
                  class="btn-eliminar"
                  style="border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer;"
                  onclick="eliminarRuta(${r.ID_ruta}, event)"
                >
                  ${traducir("comun.eliminar")}
                </button>
              </div>
            </li>`,
            )
            .join("") +
          "</ul>";
      }

      document.addEventListener("DOMContentLoaded", () => {
        const rolUsuario = (localStorage.getItem("rol") || "").trim();
        document.querySelectorAll("[data-rol]").forEach((boton) => {
          const rolesPermitidos = boton.dataset.rol
            .split(",")
            .map((rol) => rol.trim());
          if (!rolesPermitidos.includes(rolUsuario)) {
            boton.style.display = "none";
          }
        });
      });

      function toggleMenu() {
        document.getElementById("menu").classList.toggle("activo");
      }

      function cerrarSesion() {
        localStorage.removeItem("logueado");
        localStorage.removeItem("rol");
        localStorage.removeItem("nickname");
        localStorage.removeItem("mail");

        window.location.href = "index.html";
      }

      function cargarUsuario() {
        const nombre =
          localStorage.getItem("nickname") || traducir("usuario.porDefecto");

        document.getElementById("usuario").innerHTML = `
          <span class="nombre-usuario">${nombre}</span>
        `;
      }

      cargarUsuario();

      function alCambiarIdioma() {
        cargarUsuario();
        if (modoCreacion) {
          llenarSelectCentros();
          redibujarParadas();
        } else dibujarContenedores();
        if (rutas) renderizarListaRutas();
      }
      obtenerRutas();
      cargarContenedores();
      cargarCuadrillas();
      cargarCentros();
      cargarCamiones();
    </script>
  </body>
</html>
