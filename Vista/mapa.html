<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-texto="pagina.mapa">Mapa - Epsilon</title>
    <link rel="stylesheet" href="style.css" />
    <script src="idiomas.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>

  <body>
    <script>
      if (localStorage.getItem("logueado") !== "si") {
        document.documentElement.style.display = "none";
        window.location.replace("login.html");
      }
    </script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <header>
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Epsilon" />
        </a>
      </div>

      <div class="header-actions">
        <div id="usuario" class="usuario"></div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      </div>

      <nav id="menu">
        <ul>
          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              data-texto="menu.gestion"
              onclick="window.location.href = 'gestion.html'"
            >
              Gestión
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador, Operario"
              class="link-button"
              data-texto="menu.panelRutas"
              onclick="window.location.href = 'panelrutas.html'"
            >
              Panel Rutas
            </button>
          </li>

          <li>
            <button
              class="link-button"
              data-rol="Operario"
              data-texto="menu.panelOperario"
              onclick="window.location.href = 'paneloperario.html'"
            >
              Panel Operario
            </button>
          </li>

          <li>
            <button
              class="link-button"
              data-rol="Recolector"
              data-texto="menu.misIncidencias"
              onclick="window.location.href = 'misincidencias.html'"
            >
              Mis Incidencias
            </button>
          </li>

          <li>
            <button
              class="link-button"
              data-texto="menu.mapa"
              onclick="window.location.href = 'mapa.html'"
            >
              Mapa
            </button>
          </li>

          <li>
            <button
              class="link-button"
              data-texto="menu.estadisticas"
              onclick="window.location.href = 'estadisticas.html'"
            >
              Estadísticas
            </button>
          </li>

          <li>
            <button
              class="link-button"
              data-texto="menu.documentacion"
              onclick="window.location.href = 'documentacion.html'"
            >
              Documentación
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <div class="pagina">
      <h2 data-texto="mapa.titulo">Mapa de Contenedores</h2>

      <p data-texto="mapa.descripcion">
        Visualización geográfica de la ciudad.
      </p>

      <div class="panel">
        <button data-texto="mapa.verTodo" onclick="vertodo()">Ver todo</button>
        <button data-texto="mapa.verContenedores" onclick="soloContenedores()">
          Ver Contenedores
        </button>
        <button data-texto="mapa.verIncidencias" onclick="soloIncidencias()">
          Ver Incidencias
        </button>
        <button data-texto="mapa.verCentros" onclick="soloCentrosAcopio()">
          Ver Centros de Acopio
        </button>
        <button data-texto="mapa.actualizar" onclick="actualizarMapa()">
          Actualizar Mapa
        </button>
      </div>

      <div id="map"></div>
    </div>

    <script>
      // ---------- Íconos ----------
      const ICON_URL = "https://unpkg.com/lucide-static@latest/icons/";

      const ICONOS_CONTENEDOR = {
        Vacio: { url: ICON_URL + "trash-2.svg", color: "#6fcf97" },
        "Media capacidad": { url: ICON_URL + "trash-2.svg", color: "#f2c94c" },
        Lleno: { url: ICON_URL + "trash-2.svg", color: "#eb5757" },
        Desbordado: { url: ICON_URL + "trash-2.svg", color: "#a77fd6" },
        default: { url: ICON_URL + "trash-2.svg", color: "#999999" },
      };

      const ICONOS_INCIDENCIA = {
        desbordado: { url: ICON_URL + "triangle-alert.svg", color: "#a77fd6" },
        rotura: { url: ICON_URL + "triangle-alert.svg", color: "#4f4f4f" },
        incendiado: { url: ICON_URL + "flame.svg", color: "#f2994a" },
        lleno: { url: ICON_URL + "triangle-alert.svg", color: "#eb5757" },
      };

      const ICONO_CENTRO = { url: ICON_URL + "warehouse.svg", color: "#2d9cdb" };

      function crearIcono({ url, color }) {
        return L.divIcon({
          html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;box-sizing:border-box;"><img src="${url}" width="16" height="16" style="display:block;" alt="" /></div>`,
          className: "",
          iconSize: [28, 28],
          iconAnchor: [14, 14],
          popupAnchor: [0, -14],
        });
      }

      // ---------- Textos de los popups ----------
      function textoPopupIncidencia(inc) {
        return `<strong>${traducirValor("tipoIncidencia", inc.tipo)}</strong><br>${inc.calle} ${inc.numero}, ${inc.barrio}<br>${traducir("mapa.estado")}: ${traducirValor("estado", inc.estado)}`;
      }

      function textoPopupContenedor(cont) {
        return `<strong>${traducir("mapa.contenedor")}</strong><br>${cont.calle} ${cont.numero}, ${cont.barrio}<br>${traducir("mapa.capacidad")}: ${cont.capacidadCarga}<br>${traducir("mapa.tipo")}: ${traducirValor("tipoContenedor", cont.tipo)}<br>${traducir("mapa.estado")}: ${traducirValor("estado", cont.estado)}`;
      }

      function textoPopupCentro(centro) {
        return `<strong>${traducir("mapa.centroAcopio")}</strong><br>${centro.calle} ${centro.numero}, ${centro.barrio}<br>${traducir("mapa.capacidad")}: ${centro.capacidad ?? "—"}<br>${traducir("mapa.tipo")}: ${traducirValor("tipoContenedor", centro.tipoResiduo)}`;
      }

      // ---------- Carga de capas ----------
      async function CargarIncidenciasMapa() {
        try {
          const respuesta = await fetch(
            "/Proyecto/ProyectoSyntropy/Gestion/miApi/Incidencias/Incidencias",
          );
          const respuestaJson = await respuesta.json();
          const incidencias = Array.isArray(respuestaJson)
            ? respuestaJson
            : respuestaJson?.data || [];

          incidencias.forEach((inc) => {
            if (!inc.lat || !inc.lon || !ICONOS_INCIDENCIA[inc.tipo]) return;
            L.marker([inc.lat, inc.lon], {
              icon: crearIcono(ICONOS_INCIDENCIA[inc.tipo]),
            })
              .addTo(map)
              .bindPopup(textoPopupIncidencia(inc));
          });
        } catch (err) {
          console.error("Error al cargar las incidencias:", err);
        }
      }

      async function CargarContenedoresMapa() {
        try {
          const respuesta = await fetch(
            "/Proyecto/ProyectoSyntropy/Gestion/miApi/Contenedores",
          );
          const respuestaJson = await respuesta.json();
          const contenedores = Array.isArray(respuestaJson)
            ? respuestaJson
            : respuestaJson?.data || [];

          contenedores.forEach((cont) => {
            if (!cont.lat || !cont.lon) return;
            L.marker([cont.lat, cont.lon], {
              icon: crearIcono(
                ICONOS_CONTENEDOR[cont.estado] || ICONOS_CONTENEDOR.default,
              ),
            })
              .addTo(map)
              .bindPopup(textoPopupContenedor(cont));
          });
        } catch (err) {
          console.error("Error al cargar los contenedores:", err);
        }
      }

      async function CargarCentrosAcopioMapa() {
        try {
          const respuesta = await fetch(
            "/Proyecto/ProyectoSyntropy/Gestion/miApi/CentrosAcopio/CentrosAcopio",
          );
          const respuestaJson = await respuesta.json();

          if (
            respuestaJson &&
            respuestaJson.status &&
            respuestaJson.status !== "ok"
          ) {
            console.error(
              "Error al cargar los centros de acopio:",
              respuestaJson.mensaje,
            );
            return;
          }
          const centrosAcopio = Array.isArray(respuestaJson)
            ? respuestaJson
            : respuestaJson?.data || [];

          centrosAcopio.forEach((centro) => {
            if (!centro.lat || !centro.lon) return;
            L.marker([centro.lat, centro.lon], {
              icon: crearIcono(ICONO_CENTRO),
            })
              .addTo(map)
              .bindPopup(textoPopupCentro(centro));
          });
        } catch (err) {
          console.error("Error al cargar los centros de acopio:", err);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const rolUsuario = (localStorage.getItem("rol") || "").trim();
        document.querySelectorAll("[data-rol]").forEach((boton) => {
          const rolesPermitidos = boton.dataset.rol
            .split(",")
            .map((rol) => rol.trim());
          if (!rolesPermitidos.includes(rolUsuario)) {
            boton.style.display = "none";
          }
        });
      });

      function toggleMenu() {
        document.getElementById("menu").classList.toggle("activo");
      }

      function cerrarSesion() {
        localStorage.removeItem("logueado");
        localStorage.removeItem("rol");
        localStorage.removeItem("nickname");
        localStorage.removeItem("mail");

        window.location.href = "index.html";
      }

      function cargarUsuario() {
        const nombre =
          localStorage.getItem("nickname") || traducir("usuario.porDefecto");
        const inicial = nombre.charAt(0).toUpperCase();

        document.getElementById("usuario").innerHTML = `

          <span class="nombre-usuario">${nombre}</span>

          <button class="usuario-btn" onclick="abrirUsuario()">
              ${inicial}
          </button>

          <div id="menuUsuario" class="menu-usuario">

              <button onclick="cerrarSesion()">
                  ${traducir("usuario.cerrarSesion")}
              </button>

          </div>

          `;
      }

      function abrirUsuario() {
        document.getElementById("menuUsuario").classList.toggle("activo");
      }

      cargarUsuario();

      var map = L.map("map").setView([-34.9011, -56.1645], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19,
      }).addTo(map);

      function limpiarMapa() {
        map.eachLayer(function (layer) {
          if (layer instanceof L.Marker) {
            map.removeLayer(layer);
          }
        });
      }
      function vistaInicial() {
        CargarContenedoresMapa();
        CargarIncidenciasMapa();
        CargarCentrosAcopioMapa();
      }

      function actualizarMapa() {
        limpiarMapa();
        vistaActual();
      }

      let vistaActual = vistaInicial;

      function alCambiarIdioma() {
        cargarUsuario();
        limpiarMapa();
        vistaActual();
      }

      function soloContenedores() {
        vistaActual = soloContenedores;
        limpiarMapa();
        CargarContenedoresMapa();
      }
      function soloIncidencias() {
        vistaActual = soloIncidencias;
        limpiarMapa();
        CargarIncidenciasMapa();
      }
      function soloCentrosAcopio() {
        vistaActual = soloCentrosAcopio;
        limpiarMapa();
        CargarCentrosAcopioMapa();
      }
      function vertodo() {
        vistaActual = vertodo;
        limpiarMapa();
        CargarContenedoresMapa();
        CargarIncidenciasMapa();
        CargarCentrosAcopioMapa();
      }

      vistaInicial();
    </script>
  </body>
</html>
