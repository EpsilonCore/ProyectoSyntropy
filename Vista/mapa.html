<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa - Epsilon</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>

  <body>
    <script>
      if (localStorage.getItem("logueado") !== "si") {
        window.location.href = "login.html";
      }
    </script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <header>
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Epsilon" />
        </a>
      </div>

      <div class="header-actions">
        <div id="usuario" class="usuario"></div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      </div>

      <nav id="menu">
        <ul>
          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              onclick="window.location.href = 'gestion.html'"
            >
              Gestión
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador, Operario"
              class="link-button"
              onclick="window.location.href = 'panelrutas.html'"
            >
              Rutas
            </button>
          </li>

          <li>
            <button
              class="link-button"
              onclick="window.location.href = 'mapa.html'"
            >
              Mapa
            </button>
          </li>

          <li>
            <button
              class="link-button"
              onclick="window.location.href = 'estadisticas.html'"
            >
              Estadísticas
            </button>
          </li>

          <li>
            <button
              class="link-button"
              onclick="window.location.href = 'documentacion.html'"
            >
              Documentación
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <div class="pagina">
      <h2>Mapa de Contenedores</h2>

      <p>Visualización geográfica de la ciudad.</p>

      <div class="panel">
        <button onclick="vertodo()">Ver todo</button>
        <button onclick="soloContenedores()">Ver Contenedores</button>
        <button onclick="soloIncidencias()">Ver Incidencias</button>
        <button onclick="soloCentrosAcopio()">Ver Centros de Acopio</button>
        <button>Ver Camiones</button>
        <button>Actualizar Mapa</button>
      </div>

      <div id="map"></div>
    </div>

    <script>
      const ICON_URL = "https://unpkg.com/lucide-static@latest/icons/";

      // Cada elemento: url de la imagen + color de fondo según su estado
      const ICONOS = {
        contenedor: {
          Vacio: { url: ICON_URL + "trash-2.svg", color: "#6fcf97" },
          "Media capacidad": { url: ICON_URL + "trash-2.svg", color: "#f2c94c" },
          Lleno: { url: ICON_URL + "trash-2.svg", color: "#eb5757" },
          Desbordado: { url: ICON_URL + "trash-2.svg", color: "#a77fd6" },
        },
        incidencia: {
          desbordado: { url: ICON_URL + "siren.svg", color: "#f2994a" },
          rotura: { url: ICON_URL + "wrench.svg", color: "#8fa8bd" },
          incendiado: { url: ICON_URL + "flame.svg", color: "#e8795a" },
          lleno: { url: ICON_URL + "truck.svg", color: "#e57fb3" },
        },
        centro: {
          default: { url: ICON_URL + "recycle.svg", color: "#5aaee0" },
          Lleno: { url: ICON_URL + "recycle.svg", color: "#eb5757" },
          Inactivo: { url: ICON_URL + "recycle.svg", color: "#aaaaaa" },
        },
        camion: {
          default: { url: ICON_URL + "truck.svg", color: "#6fa8dc" },
          Disponible: { url: ICON_URL + "truck.svg", color: "#6fcf97" },
          "En ruta": { url: ICON_URL + "truck.svg", color: "#f2c94c" },
          Mantenimiento: { url: ICON_URL + "truck.svg", color: "#eb5757" },
        },
      };

      function crearIcono({ url, color }) {
        return L.divIcon({
          html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;box-sizing:border-box;"><img src="${url}" width="16" height="16" style="display:block;" alt="" /></div>`,
          className: "",
          iconSize: [28, 28],
          iconAnchor: [14, 14],
          popupAnchor: [0, -14],
        });
      }

      async function CargarIncidenciasMapa() {
        try {
          const respuesta = await fetch(
            "/Proyecto/ProyectoSyntropy/Gestion/miApi/Incidencias/Incidencias",
          );
          const respuestaJson = await respuesta.json();
          const incidencias = Array.isArray(respuestaJson)
            ? respuestaJson
            : respuestaJson?.data || [];
          console.log("Incidencias cargadas:", incidencias);

          incidencias.forEach((inc) => {
            if (!inc.lat || !inc.lon) return;
            const cfg = ICONOS.incidencia[inc.tipo];
            if (!cfg) return;

            L.marker([inc.lat, inc.lon], { icon: crearIcono(cfg) })
              .addTo(map)
              .bindPopup(
                `<strong>${inc.tipo}</strong><br>${inc.calle} ${inc.numero}, ${inc.barrio}<br>Estado: ${inc.estado}`,
              );
          });
        } catch (err) {
          console.error("Error al cargar las incidencias:", err);
        }
      }
      async function CargarContenedoresMapa() {
        try {
          const respuesta = await fetch(
            "/Proyecto/ProyectoSyntropy/Gestion/miApi/Contenedores",
          );
          const respuestaJson = await respuesta.json();
          const contenedores = Array.isArray(respuestaJson)
            ? respuestaJson
            : respuestaJson?.data || [];
          console.log("Contenedores cargados:", contenedores);

          contenedores.forEach((cont) => {
            if (!cont.lat || !cont.lon) return;
            const cfg = ICONOS.contenedor[cont.estado];
            if (!cfg) return;

            L.marker([cont.lat, cont.lon], { icon: crearIcono(cfg) })
              .addTo(map)
              .bindPopup(
                `<strong>Contenedor</strong><br>${cont.calle} ${cont.numero}, ${cont.barrio}<br>Capacidad: ${cont.capacidadCarga}<br>Tipo: ${cont.tipo}<br>Estado: ${cont.estado}`,
              );
          });
        } catch (err) {
          console.error("Error al cargar los contenedores:", err);
        }
      }

      async function CargarCentrosAcopioMapa() {
        try {
          const respuesta = await fetch(
            "/Proyecto/ProyectoSyntropy/Gestion/miApi/CentrosAcopio/CentrosAcopio",
          );
          const respuestaJson = await respuesta.json();

          if (
            respuestaJson &&
            respuestaJson.status &&
            respuestaJson.status !== "ok"
          ) {
            console.error(
              "Error al cargar los centros de acopio:",
              respuestaJson.message,
            );
            return;
          }
          const centrosAcopio = Array.isArray(respuestaJson)
            ? respuestaJson
            : respuestaJson?.data || [];
          console.log("Centros de acopio cargados:", centrosAcopio);

          centrosAcopio.forEach((centro) => {
            if (!centro.lat || !centro.lon) return;
            L.marker([centro.lat, centro.lon], {
              icon: crearIcono(
                ICONOS.centro[centro.estado] || ICONOS.centro.default,
              ),
            })
              .addTo(map)
              .bindPopup(
                `<strong>Centro de Acopio</strong><br>${centro.calle} ${centro.numero}, ${centro.barrio}<br>Capacidad: ${centro.capacidadCarga}<br>Tipo: ${centro.tipo}<br>Estado: ${centro.estado}`,
              );
          });
        } catch (err) {
          console.error("Error al cargar los centros de acopio:", err);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const rolUsuario = (localStorage.getItem("rol") || "").trim();
        document.querySelectorAll("[data-rol]").forEach((boton) => {
          const rolesPermitidos = boton.dataset.rol
            .split(",")
            .map((rol) => rol.trim());
          if (!rolesPermitidos.includes(rolUsuario)) {
            boton.style.display = "none";
          }
        });
      });

      function toggleMenu() {
        document.getElementById("menu").classList.toggle("activo");
      }

      function cerrarSesion() {
        localStorage.removeItem("logueado");
        localStorage.removeItem("nickname");
        window.location.href = "index.html";
      }

      function cargarUsuario() {
        const nombre = localStorage.getItem("nickname") || "Usuario";
        const inicial = nombre.charAt(0).toUpperCase();

        document.getElementById("usuario").innerHTML = `

          <span class="nombre-usuario">${nombre}</span>

          <button class="usuario-btn" onclick="abrirUsuario()">
              ${inicial}
          </button>

          <div id="menuUsuario" class="menu-usuario">

              <button onclick="cerrarSesion()">
                  Cerrar Sesión
              </button>

          </div>

          `;
      }

      function abrirUsuario() {
        document.getElementById("menuUsuario").classList.toggle("activo");
      }

      cargarUsuario();

      var map = L.map("map").setView([-34.9011, -56.1645], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19,
      }).addTo(map);

      function limpiarMapa() {
        map.eachLayer(function (layer) {
          if (layer instanceof L.Marker) {
            map.removeLayer(layer);
          }
        });
      }
      function soloContenedores() {
        limpiarMapa();
        CargarContenedoresMapa();
      }
      function soloIncidencias() {
        limpiarMapa();
        CargarIncidenciasMapa();
      }
      function soloCentrosAcopio() {
        limpiarMapa();
        CargarCentrosAcopioMapa();
      }
      function vertodo() {
        limpiarMapa();
        CargarContenedoresMapa();
        CargarIncidenciasMapa();
        CargarCentrosAcopioMapa();
      }

      CargarIncidenciasMapa();
      CargarContenedoresMapa();
    </script>
  </body>
</html>
