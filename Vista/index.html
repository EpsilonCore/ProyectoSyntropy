<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epsilon</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Epsilon" />
        </a>
      </div>

      <div class="header-actions">
        <div id="registro-btn">
          <button onclick="window.location.href = 'registro.html'">
            Registrar
          </button>
        </div>

        <div id="login-btn">
          <button onclick="window.location.href = 'login.html'">
            Iniciar Sesión
          </button>
        </div>

        <div id="usuario" class="usuario"></div>

        <button
          id="btnCrearIncidencia"
          class="btn-crear-incidencia"
          type="button"
          title="Reportar incidencia"
          aria-label="Reportar incidencia"
          onclick="
            document
              .getElementById('overlayCrearIncidencias')
              .classList.add('activo')
          "
        >
          Crear Incidencia
        </button>

        <div class="overlay" id="overlayCrearIncidencias">
          <div class="crear-centro-acopio">
            <h3>Crear Incidencia</h3>
            <form id="formCrearIncidencia">
              <input type="hidden" id="estadoCrear" value="Pendiente" />

              <label>Mail</label>
              <input id="mailCrear" type="email" required />

              <label>Tipo</label>
              <select id="tipoCrear" required>
                <option value="" disabled selected>Seleccione un tipo</option>
                <option value="rotura">Contenedor dañado</option>
                <option value="lleno">Contenedor lleno</option>
                <option value="desbordado">Contenedor desbordado</option>
                <option value="incendiado">Contenedor incendiado</option>
              </select>

              <label>Imagen (URL)</label>
              <input
                id="imagenCrear"
                type="url"
                placeholder="https://ejemplo.com/foto.jpg"
              />

              <div id="previewImagenCrear" class="preview-imagen">
                <img
                  id="imgPreviewCrear"
                  src=""
                  alt="Vista previa de la imagen"
                />
              </div>

              <label
                >Contenedor:
                <select id="selectContenedor">
                  <option value="">Cargando contenedores...</option>
                  <option value="nuevo">
                    No está en la lista (nueva dirección)
                  </option>
                </select>
              </label>

              <div id="camposDireccionNueva" style="display: none">
                <input type="text" id="calleCrear" placeholder="Calle" />
                <input type="text" id="numeroCrear" placeholder="Número" />
                <input type="text" id="barrioCrear" placeholder="Barrio" />

                <label
                  >Tipo de contenedor:
                  <select id="tipoContenedorCrear">
                    <option value="Naranja">Reciclables</option>
                    <option value="Metalico">
                      Metalico - Residuos mezclados
                    </option>
                    <option value="Plastico">
                      Plástico - Residuos mezclados
                    </option>
                  </select>
                </label>
              </div>

              <button class="btn-crear-centro-acopio" type="submit">
                Crear Incidencia
              </button>
              <button
                class="btn-cancelar-centro-acopio"
                type="button"
                onclick="
                  document
                    .getElementById('overlayCrearIncidencias')
                    .classList.remove('activo')
                "
              >
                Cancelar
              </button>
            </form>
          </div>
        </div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      </div>

      <nav id="menu">
        <ul>
          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              onclick="verificarAcceso('gestion.html')"
            >
              Gestión
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              onclick="verificarAcceso('panelcentroacopio.html')"
            >
              Centros de Acopio
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              onclick="verificarAcceso('panelincidencia.html')"
            >
              Incidencias
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador, Operario"
              class="link-button"
              onclick="verificarAcceso('rutas.html')"
            >
              Rutas
            </button>
          </li>

          <li>
            <button class="link-button" onclick="verificarAcceso('mapa.html')">
              Mapa
            </button>
          </li>

          <li>
            <button
              class="link-button"
              onclick="verificarAcceso('estadisticas.html')"
            >
              Estadísticas
            </button>
          </li>

          <li>
            <button
              class="link-button"
              onclick="verificarAcceso('documentacion.html')"
            >
              Documentación
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <section class="contenido">
      <div class="texto">
        <h4>EPSILON</h4>

        <h2>
          Transformando <br />
          la Gestión <br />
          Urbana
        </h2>

        <p>
          Plataforma integral para el monitoreo, recolección y optimización de
          residuos en tiempo real.
        </p>

        <div class="botones">
          <button onclick="verificarAcceso('mapa.html')">Explorar Mapa</button>

          <button onclick="verificarAcceso('documentacion.html')">
            Documentación
          </button>
        </div>
      </div>

      <div class="imagen">
        <img src="fotocamion.png" alt="Camión" />
      </div>
    </section>

    <script>
      const API_URL =
        "http://localhost/Proyecto/ProyectoSyntropy/Gestion/miApi/Incidencias/";

      document.addEventListener("DOMContentLoaded", () => {
        const rolUsuario = (localStorage.getItem("rol") || "").trim();
        console.log(
          "[filtro-roles] rol en localStorage:",
          JSON.stringify(localStorage.getItem("rol")),
        );

        document.querySelectorAll("[data-rol]").forEach((boton) => {
          const rolesPermitidos = boton.dataset.rol
            .split(",")
            .map((rol) => rol.trim());

          if (!rolesPermitidos.includes(rolUsuario)) {
            boton.style.display = "none";
          }
        });
      });

      function toggleMenu() {
        document.getElementById("menu").classList.toggle("activo");
      }

      function verificarAcceso(destino) {
        if (localStorage.getItem("logueado") === "si") {
          window.location.href = destino;
        } else {
          window.location.href = "login.html";
        }
      }

      function cerrarSesion() {
        localStorage.removeItem("logueado");
        localStorage.removeItem("nombreUsuario");

        location.reload();
      }

      function cargarUsuario() {
        const usuario = document.getElementById("usuario");

        const registro = document.getElementById("registro-btn");

        const login = document.getElementById("login-btn");

        if (localStorage.getItem("logueado") === "si") {
          registro.style.display = "none";
          login.style.display = "none";

          const nombre = localStorage.getItem("nombreUsuario") || "Usuario";
          const inicial = nombre.charAt(0).toUpperCase();

          usuario.innerHTML = `

            <span class="nombre-usuario">${nombre}</span>

            <button class="usuario-btn" onclick="abrirUsuario()">
                ${inicial}
            </button>

            <div id="menuUsuario" class="menu-usuario">

                <button onclick="cerrarSesion()">
                    Cerrar Sesión
                </button>

            </div>

            `;
        }
      }

      function abrirUsuario() {
        document.getElementById("menuUsuario").classList.toggle("activo");
      }

      cargarUsuario();

      document
        .getElementById("formCrearIncidencia")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const datos = {
            mail: document.getElementById("mailCrear").value,
            tipo: document.getElementById("tipoCrear").value,
            estado: document.getElementById("estadoCrear").value,
            imagen: document.getElementById("imagenCrear").value,
            calle: document.getElementById("calleCrear").value,
            barrio: document.getElementById("barrioCrear").value,
            numero: document.getElementById("numeroCrear").value,
            tipoContenedor: document.getElementById("tipoContenedorCrear")
              .value,
          };

          const resp = await fetch(`${API_URL}Registrar`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });

          const resultado = await resp.text();
          console.log(resultado);

          if (resultado.status === "success") {
            document
              .getElementById("overlayCrearIncidencias")
              .classList.remove("activo");
            obtenerIncidencias();
          } else {
            alert(resultado.mensaje);
          }
        });

      async function cargarContenedoresEnSelect() {
        const respuesta = await fetch(
          "/Proyecto/ProyectoSyntropy/Gestion/miApi/Contenedores",
        );
        const contenedores = await respuesta.json();

        const select = document.getElementById("selectContenedor");
        select.innerHTML = '<option value="">Seleccioná un contenedor</option>';

        contenedores.forEach((c) => {
          const opcion = document.createElement("option");
          opcion.value = c.ID_contenedor;
          opcion.textContent = `${c.calle} ${c.numero}, ${c.barrio}`;
          select.appendChild(opcion);
        });

        const opcionNueva = document.createElement("option");
        opcionNueva.value = "nuevo";
        opcionNueva.textContent = "No está en la lista (nueva dirección)";
        select.appendChild(opcionNueva);
      }

      document.getElementById("imagenCrear").addEventListener("input", (e) => {
        const url = e.target.value.trim();
        const preview = document.getElementById("previewImagenCrear");
        const img = document.getElementById("imgPreviewCrear");

        if (url) {
          img.src = url;
          preview.classList.add("activo");
        } else {
          preview.classList.remove("activo");
        }
      });

      document
        .getElementById("selectContenedor")
        .addEventListener("change", (e) => {
          document.getElementById("camposDireccionNueva").style.display =
            e.target.value === "nuevo" ? "block" : "none";
        });
      document
        .getElementById("formIncidencia")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const idSeleccionado =
            document.getElementById("selectContenedor").value;

          const body = {
            mail: document.getElementById("mailIncidencia").value,
            tipo: document.getElementById("tipoIncidencia").value,
            imagenUrl: document.getElementById("imagenIncidencia").value,
          };

          if (idSeleccionado === "nuevo") {
            body.calle = document.getElementById("calleNueva").value;
            body.numero = document.getElementById("numeroNueva").value;
            body.barrio = document.getElementById("barrioNueva").value;
            body.tipoContenedor = document.getElementById(
              "tipoContenedorNuevo",
            ).value;
          } else {
            body.idContenedor = idSeleccionado;
          }

          const respuesta = await fetch(
            "/Proyecto/ProyectoSyntropy/Gestion/miApi/Incidencias/Registrar",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            },
          );
        });

      cargarContenedoresEnSelect();
    </script>
  </body>
</html>
