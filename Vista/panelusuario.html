<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-texto="pagina.panelusuario">Panel de Usuario - Epsilon</title>

    <link rel="stylesheet" href="style.css" />
    <script src="idiomas.js"></script>
  </head>

  <body>
    <script>
      if (localStorage.getItem("logueado") !== "si") {
        window.location.href = "login.html";
      }
      if ((localStorage.getItem("rol") || "").trim() !== "Administrador") {
        window.location.href = "index.html";
      }
    </script>

    <header>
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Epsilon" />
        </a>
      </div>

      <div class="header-actions">
        <div id="usuario" class="usuario"></div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      </div>

      <nav id="menu">
        <ul>
          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              data-texto="menu.gestion"
              onclick="window.location.href = 'gestion.html'"
            >
              Gestión
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              data-texto="menu.panelRegistro"
              onclick="window.location.href = 'panelregistro.html'"
            >
              Panel Registro
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              data-texto="menu.contenedores"
              onclick="window.location.href = 'panelcontenedor.html'"
            >
              Contenedores
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              data-texto="menu.camiones"
              onclick="window.location.href = 'panelcamion.html'"
            >
              Camiones
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              data-texto="menu.panelUsuario"
              onclick="window.location.href = 'panelusuario.html'"
            >
              Panel de Usuario
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              data-texto="menu.cuadrillas"
              onclick="window.location.href = 'panelcuadrilla.html'"
            >
              Cuadrillas
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <div class="pagina">
      <h2 data-texto="pusu.titulo">Panel de Usuario</h2>

      <p data-texto="pusu.descripcion">
        Administración de usuarios del sistema.
      </p>

      <div class="panel" id="OverlayCrearUsuario">
        <button data-texto="pusu.crear" onclick="abrirCrearUsuario()">
          Crear Usuario
        </button>
      </div>
      <div class="overlay" id="overlayCrearUsuarios">
        <div class="crear-usuario">
          <h3 data-texto="pusu.crear">Crear Usuario</h3>
          <form id="formCrearUsuario">
            <label data-texto="comun.nombre">Nombre</label>
            <input id="nombreCrear" required />

            <label data-texto="comun.apellido">Apellido</label>
            <input id="apellidoCrear" required />

            <label data-texto="comun.mail">Mail</label>
            <input id="mailCrear" type="email" required />

            <label data-texto="pusu.contrasenia">Contraseña</label>
            <input id="passwordCrear" type="password" required />

            <label data-texto="pusu.usuario">Usuario</label>
            <input id="nicknameCrear" />

            <label data-texto="pusu.rol">Rol</label>
            <select id="rolCrear" required>
              <option value="" disabled data-texto="pusu.seleccioneRol">
                Seleccione un rol
              </option>
              <option value="Vecino" data-texto="rol.Vecino">Vecino</option>
              <option value="Operario" data-texto="rol.Operario">Operario</option>
              <option value="Recolector" data-texto="rol.Recolector">Recolector</option>
              <option value="Administrador" data-texto="rol.Administrador">Administrador</option>
            </select>

            <button
              class="btn-crear-usuario"
              type="submit"
              data-texto="pusu.crear"
            >
              Crear Usuario
            </button>
            <button
              class="btn-cancelar-usuario"
              data-texto="comun.cancelar"
              onclick="
                document
                  .getElementById('overlayCrearUsuarios')
                  .classList.remove('activo')
              "
            >
              Cancelar
            </button>
          </form>
        </div>
      </div>

      <div class="lista-panel">
        <h3 data-texto="pusu.listaTitulo">Lista de Usuarios</h3>
        <ul id="listaUsuarios">
          <p data-texto="pusu.cargando">Cargando usuarios...</p>
        </ul>
      </div>
    </div>

    <div
      class="overlay"
      id="overlayUsuarios"
      onclick="cerrarModalUsuarios(event)"
    >
      <div class="modal-usuarios">
        <h3 data-texto="pusu.modificarTitulo">Modificar usuario</h3>

        <form id="formModificarUsuario">
          <input type="hidden" id="mailOriginal" />

          <label data-texto="comun.nombre">Nombre</label>
          <input
            id="nombreEditar"
            data-placeholder="comun.noModificar"
            placeholder="Dejar vacío para no modificar"
          />

          <label data-texto="comun.apellido">Apellido</label>
          <input
            id="apellidoEditar"
            data-placeholder="comun.noModificar"
            placeholder="Dejar vacío para no modificar"
          />

          <label data-texto="pusu.usuario">Usuario</label>
          <input
            id="nicknameEditar"
            data-placeholder="comun.noModificar"
            placeholder="Dejar vacío para no modificar"
          />
          <label data-texto="pusu.rol">Rol</label>
          <select id="rolEditar" required>
            <option value="" disabled data-texto="pusu.seleccioneRol">
                Seleccione un rol
              </option>
            <option value="Vecino" data-texto="rol.Vecino">Vecino</option>
            <option value="Operario" data-texto="rol.Operario">Operario</option>
            <option value="Recolector" data-texto="rol.Recolector">Recolector</option>
            <option value="Administrador" data-texto="rol.Administrador">Administrador</option>
          </select>
          <button
            class="btn-guardar-usuario"
            type="submit"
            data-texto="comun.guardar"
          >
            Guardar cambios
          </button>
          <button
            class="btn-cancelar-usuario"
            type="button"
            data-texto="comun.cancelar"
            onclick="
              document
                .getElementById('overlayUsuarios')
                .classList.remove('activo')
            "
          >
            Cancelar
          </button>
        </form>
      </div>
    </div>

    <script>
      const API_URL =
        "http://localhost/Proyecto/ProyectoSyntropy/Usuarios/miApi/";
      let usuarios = null;

      document
        .getElementById("formModificarUsuario")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const datos = {
            mail: document.getElementById("mailOriginal").value,
            nombre: document.getElementById("nombreEditar").value,
            apellido: document.getElementById("apellidoEditar").value,
            nickname: document.getElementById("nicknameEditar").value,
            rol: document.getElementById("rolEditar").value,
          };

          const resp = await fetch(`${API_URL}Modificar`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });

          const resultado = await resp.json();

          if (resultado.status === "ok") {
            document
              .getElementById("overlayUsuarios")
              .classList.remove("activo");
            obtenerUsuarios(); // refresca la lista
          } else {
            alert(mensajeStatus(resultado));
          }
        });
      document
        .getElementById("formCrearUsuario")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const datos = {
            nombre: document.getElementById("nombreCrear").value,
            apellido: document.getElementById("apellidoCrear").value,
            mail: document.getElementById("mailCrear").value,
            contrasenia: document.getElementById("passwordCrear").value,
            usuario: document.getElementById("nicknameCrear").value,
            rol: document.getElementById("rolCrear").value,
          };

          const resp = await fetch(`${API_URL}Registrar`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });

          const resultado = await resp.json();

          if (resultado.status === "ok") {
            document
              .getElementById("overlayCrearUsuarios")
              .classList.remove("activo");
            obtenerUsuarios();
          } else {
            alert(mensajeStatus(resultado));
          }
        });

      document.addEventListener("DOMContentLoaded", () => {
        const rolUsuario = (localStorage.getItem("rol") || "").trim();
        document.querySelectorAll("[data-rol]").forEach((boton) => {
          const rolesPermitidos = boton.dataset.rol
            .split(",")
            .map((rol) => rol.trim());
          if (!rolesPermitidos.includes(rolUsuario)) {
            boton.style.display = "none";
          }
        });
      });

      function toggleMenu() {
        document.getElementById("menu").classList.toggle("activo");
      }

      function cerrarSesion() {
        localStorage.removeItem("logueado");
        localStorage.removeItem("nickname");

        window.location.href = "index.html";
      }

      function cargarUsuario() {
        const nombre = localStorage.getItem("nickname") || traducir("usuario.porDefecto");
        const inicial = nombre.charAt(0).toUpperCase();

        document.getElementById("usuario").innerHTML = `

      <span class="nombre-usuario">${nombre}</span>

      <button class="usuario-btn" onclick="abrirUsuario()">
          ${inicial}
      </button>

      <div id="menuUsuario" class="menu-usuario">

          <button onclick="cerrarSesion()">
              ${traducir("usuario.cerrarSesion")}
          </button>

      </div>

      `;
      }

      function abrirUsuario() {
        document.getElementById("menuUsuario").classList.toggle("activo");
      }

      cargarUsuario();

      function alCambiarIdioma() {
        cargarUsuario();
        if (usuarios) renderizarLista();
      }

      function abrirModalUsuarios() {
        document.getElementById("overlayUsuarios").classList.add("activo");
      }
      function abrirCrearUsuario() {
        document.getElementById("overlayCrearUsuarios").classList.add("activo");
      }

      function cerrarModalUsuarios(evento) {
        if (evento.target.id === "overlayUsuarios") {
          document.getElementById("overlayUsuarios").classList.remove("activo");
        }
      }

      function seleccionarUsuario(mail) {
        const usuario = usuarios.find((u) => u.mail === mail);
        if (!usuario) return;

        document.getElementById("mailOriginal").value = usuario.mail;
        document.getElementById("nombreEditar").value = usuario.nombre;
        document.getElementById("apellidoEditar").value = usuario.apellido;
        document.getElementById("nicknameEditar").value =
          usuario.nickname ?? "";
        document.getElementById("rolEditar").value = usuario.rol ?? "";

        document.getElementById("overlayUsuarios").classList.add("activo");
      }
      async function obtenerUsuarios() {
        try {
          const resp = await fetch(`${API_URL}Usuarios`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          const todos = Array.isArray(data) ? data : data?.usuarios || [];
          usuarios = todos.filter((u) => u.estado_usuario === "Activo");
          renderizarLista();
        } catch (error) {
          console.error("Error al obtener usuarios:", error);
        }
      }
      async function eliminarUsuario(mail) {
        const usuario = usuarios.find((u) => u.mail === mail);
        if (confirm(traducir("pusu.confirmarEliminar"))) {
          const resp = await fetch(`${API_URL}Borrar`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mail }),
          });
          try {
            const resultado = await resp.json();
            if (resultado?.status === "ok") {
              obtenerUsuarios();
            } else {
              alert(mensajeStatus(resultado));
            }
          } catch (error) {
            console.error(error);
            alert(traducir("comun.conexion"));
          }
        }
      }
      function renderizarLista() {
        const listaContainer = document.getElementById("listaUsuarios");

        if (usuarios.length === 0) {
          listaContainer.innerHTML = `<p>${traducir("pusu.vacio")}</p>`;
          return;
        }

        let html = '<ul style="list-style: none; padding: 0; margin: 0;">';

        usuarios.forEach((usuario) => {
          html += `
<li class="usuario-item">
  <span>
    <strong>${usuario.nombre} ${usuario.apellido} ${usuario.nickname ?? traducir("pusu.sinNickname")} ${usuario.mail}</strong>
    - ${usuario.rol ? traducirValor("rol", usuario.rol) : traducir("pusu.sinRol")}
    - ${usuario.estado_registro ? traducirValor("estado", usuario.estado_registro) : traducir("comun.sinEstado")}
  </span>
  <span class="usuario-acciones">
    <button class="btn-modificar" onclick="seleccionarUsuario('${usuario.mail}')">
      ${traducir("comun.modificar")}
    </button>
    <button
      class="btn-eliminar"
      style="background-color: #e74c3c; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 14px; cursor: pointer;"
      onclick="eliminarUsuario('${usuario.mail}')">
      ${traducir("comun.eliminar")}
    </button>
  </span>
</li>`;
        });

        html += "</ul>";
        listaContainer.innerHTML = html;
      }

      obtenerUsuarios();
    </script>
  </body>
</html>
