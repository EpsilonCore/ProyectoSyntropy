<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Panel Contenedores - Epsilon</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <script>
      if (localStorage.getItem("logueado") !== "si") {
        window.location.href = "login.html";
      }
      if ((localStorage.getItem("rol") || "").trim() !== "Administrador") {
        window.location.href = "index.html";
      }
    </script>

    <header>
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Epsilon" />
        </a>
      </div>

      <div class="header-actions">
        <div id="usuario" class="usuario"></div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      </div>

      <nav id="menu">
        <ul>
          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              onclick="window.location.href = 'gestion.html'"
            >
              Gestión
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              onclick="window.location.href = 'panelregistro.html'"
            >
              Panel Registro
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              onclick="window.location.href = 'panelcontenedor.html'"
            >
              Contenedores
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              onclick="window.location.href = 'panelcamion.html'"
            >
              Camiones
            </button>
          </li>

          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              onclick="window.location.href = 'panelusuario.html'"
            >
              Panel de Usuario
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <div class="pagina">
      <h2>Panel Contenedores</h2>

      <p>Gestión de contenedores registrados en el sistema.</p>

      <div class="panel" id="OverlayCrearContenedor">
        <button onclick="abrirCrearContenedor()">Crear Contenedor</button>
      </div>
      <div class="overlay" id="overlayCrearContenedores">
        <div class="crear-contenedor">
          <h3>Crear Contenedor</h3>
          <form id="formCrearContenedor">
            <label>Tipo</label>
            <select id="tipoCrear" required>
              <option value="" disabled>Seleccione un tipo</option>
              <option value="Naranja">Naranja - Reciclables</option>
              <option value="Metalico">Metalico - Residuos mezclados</option>
              <option value="Plastico">Plastico - Residuos mezclados</option>
            </select>

            <label>Capacidad de carga</label>
            <input id="capCargaCrear" type="number" required />

            <label>Estado</label>
            <select id="estadoCrear" required>
              <option value="" disabled>Seleccione un estado</option>
              <option value="Lleno">Lleno</option>
              <option value="Vacio">Vacio</option>
              <option value="Desbordado">Desbordado</option>
              <option value="Media capacidad">Media capacidad</option>
            </select>

            <label>Calle</label>
            <input id="calleCrear" required />

            <label>Número</label>
            <input id="numeroCrear" required />

            <label>Barrio</label>
            <input id="barrioCrear" required />

            <button class="btn-crear-contenedor" type="submit">
              Crear Contenedor
            </button>
            <button
              class="btn-cancelar-usuario"
              type="button"
              onclick="
                document
                  .getElementById('overlayCrearContenedores')
                  .classList.remove('activo')
              "
            >
              Cancelar
            </button>
          </form>
        </div>
      </div>

      <div class="lista-panel">
        <h3>Lista de Contenedores</h3>
        <ul id="listaContenedores">
          <p>Cargando contenedores...</p>
        </ul>
      </div>
    </div>

    <div
      class="overlay"
      id="overlayContenedores"
      onclick="cerrarModalContenedores(event)"
    >
      <div class="modal-contenedores">
        <h3>Modificar contenedor</h3>

        <form id="formModificarContenedor">
          <input type="hidden" id="idOriginalContenedor" />

          <label>Tipo</label>
          <select id="tipoEditar" required>
            <option value="" disabled selected>Seleccione un tipo</option>
            <option value="Naranja">Naranja - Reciclables</option>
            <option value="Metalico">Metalico - Residuos mezclados</option>
            <option value="Plastico">Plastico - Residuos mezclados</option>
          </select>

          <label>Capacidad de carga</label>
          <input id="capCargaEditar" type="number" required />

          <label>Estado</label>
          <select id="estadoEditar" required>
            <option value="" disabled>Seleccione un estado</option>
            <option value="Lleno">Lleno</option>
            <option value="Vacio">Vacio</option>
            <option value="Desbordado">Desbordado</option>
            <option value="Media capacidad">Media capacidad</option>
          </select>

          <label>Calle</label>
          <input id="calleEditar" required />

          <label>Número</label>
          <input id="numeroEditar" required />

          <label>Barrio</label>
          <input id="barrioEditar" required />

          <button class="btn-guardar-usuario" type="submit">
            Guardar cambios
          </button>
          <button
            class="btn-cancelar-usuario"
            type="button"
            onclick="
              document
                .getElementById('overlayContenedores')
                .classList.remove('activo')
            "
          >
            Cancelar
          </button>
        </form>
      </div>
    </div>

    <script>
      const API_URL =
        "http://localhost/Proyecto/ProyectoSyntropy/Gestion/miApi/";
      let contenedores = [];

      document
        .getElementById("formModificarContenedor")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const datos = {
            idContenedor: document.getElementById("idOriginalContenedor").value,
            capCarga: document.getElementById("capCargaEditar").value,
            tipo: document.getElementById("tipoEditar").value,
            estado: document.getElementById("estadoEditar").value,
            calle: document.getElementById("calleEditar").value,
            numero: document.getElementById("numeroEditar").value,
            barrio: document.getElementById("barrioEditar").value,
          };

          const resp = await fetch(`${API_URL}ActualizarContenedor`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });

          const resultado = await resp.json();

          if (resultado.status === "ok") {
            document
              .getElementById("overlayContenedores")
              .classList.remove("activo");
            obtenerContenedores(); // refresca la lista
          } else {
            alert(resultado.mensaje);
          }
        });

      document
        .getElementById("formCrearContenedor")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const datos = {
            capCarga: document.getElementById("capCargaCrear").value,
            tipo: document.getElementById("tipoCrear").value,
            estado: document.getElementById("estadoCrear").value,
            calle: document.getElementById("calleCrear").value,
            numero: document.getElementById("numeroCrear").value,
            barrio: document.getElementById("barrioCrear").value,
          };

          const resp = await fetch(`${API_URL}RegistrarContenedor`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });

          const resultado = await resp.json();

          if (resultado.status === "creado") {
            document
              .getElementById("overlayCrearContenedores")
              .classList.remove("activo");
            obtenerContenedores();
          } else {
            alert(resultado.mensaje);
          }
        });

      document.addEventListener("DOMContentLoaded", () => {
        const rolUsuario = (localStorage.getItem("rol") || "").trim();
        document.querySelectorAll("[data-rol]").forEach((boton) => {
          const rolesPermitidos = boton.dataset.rol
            .split(",")
            .map((rol) => rol.trim());
          if (!rolesPermitidos.includes(rolUsuario)) {
            boton.style.display = "none";
          }
        });
      });

      function toggleMenu() {
        document.getElementById("menu").classList.toggle("activo");
      }

      function cerrarSesion() {
        localStorage.removeItem("logueado");
        localStorage.removeItem("nickname");

        window.location.href = "index.html";
      }

      function cargarUsuario() {
        const nombre = localStorage.getItem("nickname") || "Usuario";
        const inicial = nombre.charAt(0).toUpperCase();

        document.getElementById("usuario").innerHTML = `

      <span class="nombre-usuario">${nombre}</span>

      <button class="usuario-btn" onclick="abrirUsuario()">
          ${inicial}
      </button>

      <div id="menuUsuario" class="menu-usuario">

          <button onclick="cerrarSesion()">
              Cerrar Sesión
          </button>

      </div>

      `;
      }

      function abrirUsuario() {
        document.getElementById("menuUsuario").classList.toggle("activo");
      }

      cargarUsuario();

      function abrirCrearContenedor() {
        document
          .getElementById("overlayCrearContenedores")
          .classList.add("activo");
      }

      function cerrarModalContenedores(evento) {
        if (evento.target.id === "overlayContenedores") {
          document
            .getElementById("overlayContenedores")
            .classList.remove("activo");
        }
      }

      function seleccionarContenedor(id) {
        const contenedor = contenedores.find((c) => c.ID_contenedor == id);
        if (!contenedor) return;

        document.getElementById("idOriginalContenedor").value =
          contenedor.ID_contenedor;
        document.getElementById("tipoEditar").value = contenedor.tipo ?? "";
        document.getElementById("capCargaEditar").value =
          contenedor.capacidadCarga ?? "";
        document.getElementById("estadoEditar").value = contenedor.estado ?? "";
        document.getElementById("calleEditar").value = contenedor.calle ?? "";
        document.getElementById("numeroEditar").value = contenedor.numero ?? "";
        document.getElementById("barrioEditar").value = contenedor.barrio ?? "";

        document.getElementById("overlayContenedores").classList.add("activo");
      }

      async function obtenerContenedores() {
        try {
          const resp = await fetch(`${API_URL}Contenedores`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          contenedores = Array.isArray(data) ? data : data?.data || [];
          renderizarLista();
        } catch (error) {
          console.error("Error al obtener contenedores:", error);
        }
      }

      async function eliminarContenedor(id) {
        if (confirm("¿Está seguro de que desea eliminar este contenedor?")) {
          const resp = await fetch(`${API_URL}EliminarContenedor`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idContenedor: id }),
          });
          try {
            const resultado = await resp.json();
            if (resultado.status === "ok") {
              obtenerContenedores();
            } else {
              alert("No se pudo eliminar el contenedor.");
            }
          } catch (error) {
            console.error(error);
            alert("Error de conexión al eliminar contenedor.");
          }
        }
      }

      function renderizarLista() {
        const listaContainer = document.getElementById("listaContenedores");

        if (contenedores.length === 0) {
          listaContainer.innerHTML = "<p>No hay contenedores disponibles.</p>";
          return;
        }

        let html = '<ul style="list-style: none; padding: 0; margin: 0;">';

        contenedores.forEach((contenedor) => {
          html += `
<li class="contenedor-item">
  <span>
    <strong>Contenedor #${contenedor.ID_contenedor} - ${contenedor.tipo ?? "Sin tipo"}</strong>
    - ${contenedor.calle ?? ""} ${contenedor.numero ?? ""}, ${contenedor.barrio ?? "Sin barrio"}
    - Carga: ${contenedor.capacidadCarga ?? "Sin capacidad"}
    - ${contenedor.estado ?? "Sin estado"}
  </span>
  <span class="contenedor-acciones">
    <button class="btn-modificar" onclick="seleccionarContenedor('${contenedor.ID_contenedor}')">
      Modificar
    </button>
    <button class="btn-eliminar"style="background-color: #e74c3c; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 14px; cursor: pointer;" onclick="eliminarContenedor('${contenedor.ID_contenedor}')">
      Eliminar
    </button>
  </span>
</li>`;
        });

        html += "</ul>";
        listaContainer.innerHTML = html;
      }

      obtenerContenedores();
    </script>
  </body>
</html>
