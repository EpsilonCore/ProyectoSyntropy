<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentación - Epsilon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<script>
if(localStorage.getItem("logueado") !== "si"){
    window.location.href = "login.html";
}
</script>

<header>

    <div class="logo">
        <a href="index.html">
            <img src="logo.png" alt="Epsilon">
        </a>
    </div>

    <div class="header-actions">

        <div id="usuario" class="usuario"></div>

        <div class="menu-toggle" onclick="toggleMenu()">
            ☰
        </div>

    </div>

    <nav id="menu">

        <ul>

            <li>
                <button class="link-button" data-rol="Administrador"
                onclick="window.location.href='gestion.html'">
                    Gestión
                </button>
            </li>

            <li>
                <button class="link-button" data-rol="Administrador, Operario"
                onclick="window.location.href='rutas.html'">
                    Rutas
                </button>
            </li>

            <li>
                <button class="link-button"
                onclick="window.location.href='mapa.html'">
                    Mapa
                </button>
            </li>

            <li>
                <button class="link-button"
                onclick="window.location.href='estadisticas.html'">
                    Estadísticas
                </button>
            </li>

            <li>
                <button class="link-button"
                onclick="window.location.href='documentacion.html'">
                    Documentación
                </button>
            </li>

        </ul>

    </nav>

</header>

<div class="pagina">

    <h2>Documentación</h2>

    <p>
        Manuales e información del sistema.
    </p>

    <div class="panel">

        <button>
            Manual de Usuario
        </button>

        <button>
            Guías
        </button>

        <button>
            Preguntas Frecuentes
        </button>

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {
    const rolUsuario = (localStorage.getItem("rol") || "").trim();
    document.querySelectorAll("[data-rol]").forEach((boton) => {
        const rolesPermitidos = boton.dataset.rol
            .split(",")
            .map((rol) => rol.trim());
        if (!rolesPermitidos.includes(rolUsuario)) {
            boton.style.display = "none";
        }
    });
});

function toggleMenu(){
    document.getElementById("menu").classList.toggle("activo");
}

function cerrarSesion(){

    localStorage.removeItem("logueado");
    localStorage.removeItem("nombreUsuario");

    window.location.href =
    "index.html";

}

function cargarUsuario(){

    const nombre = localStorage.getItem("nombreUsuario") || "Usuario";
    const inicial = nombre.charAt(0).toUpperCase();

    document.getElementById("usuario").innerHTML = `

    <span class="nombre-usuario">${nombre}</span>

    <button class="usuario-btn" onclick="abrirUsuario()">
        ${inicial}
    </button>

    <div id="menuUsuario" class="menu-usuario">

        <button onclick="cerrarSesion()">
            Cerrar Sesión
        </button>

    </div>

    `;

}

function abrirUsuario(){
    document.getElementById("menuUsuario").classList.toggle("activo");
}

cargarUsuario();

</script>

</body>
</html>
