<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-texto="pagina.panelregistro">Panel Registro - Epsilon</title>
    <link rel="stylesheet" href="style.css" />
    <script src="idiomas.js"></script>
  </head>

  <body>
    <script>
      {
        const rol = (localStorage.getItem("rol") || "").trim();
        const sinSesion = localStorage.getItem("logueado") !== "si";

        if (sinSesion || !["Administrador"].includes(rol)) {
          document.documentElement.style.display = "none";
          window.location.replace(sinSesion ? "login.html" : "index.html");
        }
      }
    </script>

    <header>
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Epsilon" />
        </a>
      </div>

      <div class="header-actions">
        <div id="usuario" class="usuario"></div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      </div>

      <nav id="menu">
        <ul>
          <li>
            <button
              data-rol="Administrador"
              class="link-button"
              data-texto="menu.gestion"
              onclick="window.location.href = 'gestion.html'"
            >
              Gestión
            </button>
          </li>
          <li>
            <button
              class="link-button"
              data-rol="Administrador"
              data-texto="menu.panelUsuario"
              onclick="window.location.href = 'panelusuario.html'"
            >
              Panel de Usuario
            </button>
          </li>
           <li>
              <button
                class="link-button"
                onclick="verificarAcceso('mapa.html')"
                data-texto="menu.mapa"
              >
                Mapa
              </button>
            </li>

            <li>
              <button
                class="link-button"
                onclick="verificarAcceso('estadisticas.html')"
                data-texto="menu.estadisticas"
              >
                Estadísticas
              </button>
            </li>

            <li>
              <button
                class="link-button"
                onclick="verificarAcceso('documentacion.html')"
                data-texto="menu.documentacion"
              >
                Documentación
              </button>
            </li>
        </ul>
      </nav>
    </header>

    <div class="pagina">
      <h2 data-texto="preg.titulo">Panel Registro</h2>
      <p data-texto="preg.descripcion">
        Administración de usuarios pendientes de confirmación.
      </p>

      <div class="lista-panel">
        <h3 data-texto="preg.pendientes">Usuarios pendientes</h3>
        <div id="listaUsuarios">
          <p data-texto="preg.cargando">Cargando usuarios...</p>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const rolUsuario = (localStorage.getItem("rol") || "").trim();
        document.querySelectorAll("[data-rol]").forEach((boton) => {
          const rolesPermitidos = boton.dataset.rol
            .split(",")
            .map((rol) => rol.trim());
          if (!rolesPermitidos.includes(rolUsuario)) {
            boton.style.display = "none";
          }
        });
      });

      function toggleMenu() {
        document.getElementById("menu").classList.toggle("activo");
      }

      function cerrarSesion() {
        localStorage.removeItem("logueado");
        localStorage.removeItem("rol");
        localStorage.removeItem("nickname");
        localStorage.removeItem("mail");

        window.location.href = "index.html";
      }

      function cargarUsuario() {
        const nombre =
          localStorage.getItem("nickname") || traducir("usuario.porDefecto");
        const inicial = nombre.charAt(0).toUpperCase();

        document.getElementById("usuario").innerHTML = `
          <span class="nombre-usuario">${nombre}</span>
          <button class="usuario-btn" onclick="abrirUsuario()">
              ${inicial}
          </button>
          <div id="menuUsuario" class="menu-usuario">
              <button onclick="cerrarSesion()">
                  ${traducir("usuario.cerrarSesion")}
              </button>
          </div>
        `;
      }

      function abrirUsuario() {
        document.getElementById("menuUsuario").classList.toggle("activo");
      }

      cargarUsuario();

      const API_URL =
        "http://localhost/Proyecto/ProyectoSyntropy/Usuarios/miApi/";
      let usuarios = null;

      const listaContainer = document.getElementById("listaUsuarios");

      async function obtenerUsuarios() {
        try {
          const resp = await fetch(`${API_URL}ListarPendientes`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();

          usuarios = Array.isArray(data) ? data : data?.usuarios || [];
          renderizarLista();
        } catch (error) {
          console.error("Error al obtener usuarios:", error);
          listaContainer.innerHTML = `<p>${traducir("preg.errorCargar")}</p>`;
        }
      }

      async function enviarAccion(mail, decision) {
        try {
          const resp = await fetch(`${API_URL}Actualizar`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mail, decision }),
          });

          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const resultado = await resp.json();

          if (resultado?.status === "ok") {
            const usuario = usuarios.find((u) => u.mail === mail);
            if (usuario) {
              usuario.estado =
                decision === "Aceptado" ? "Aceptado" : "Rechazado";
            }
            renderizarLista();
          } else {
            alert(mensajeStatus(resultado));
          }
        } catch (error) {
          console.error(error);
          alert(traducir("comun.conexion"));
        }
      }

      function renderizarLista() {
        const pendientes = usuarios.filter((u) => u.estado === "Pendiente");

        if (pendientes.length === 0) {
          listaContainer.innerHTML = `
                <p>${traducir("preg.sinPendientes")}</p>
                <p>${traducir("preg.todosProcesados")}</p>`;
          return;
        }

        let html = '<ul style="list-style: none; padding: 0; margin: 0;">';
        pendientes.forEach((usuario) => {
          html += `
                <li style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px;">
                    <span><strong>${usuario.nombre}</strong></span>
                    <span style="display: flex; gap: 10px;">
                        <button style="padding: 10px 18px; border: none; border-radius: 6px; color: #fff; font-size: 0.95rem; cursor: pointer; background-color: #27ae60;" onmouseover="this.style.opacity=0.85" onmouseout="this.style.opacity=1" onclick="aceptarUsuario('${usuario.mail}')">${traducir("preg.aceptar")}</button>
                        <button style="padding: 10px 18px; border: none; border-radius: 6px; color: #fff; font-size: 0.95rem; cursor: pointer; background-color: #c0392b;" onmouseover="this.style.opacity=0.85" onmouseout="this.style.opacity=1" onclick="rechazarUsuario('${usuario.mail}')">${traducir("preg.rechazar")}</button>
                    </span>
                </li>`;
        });
        html += "</ul>";
        listaContainer.innerHTML = html;
      }

      function alCambiarIdioma() {
        cargarUsuario();
        if (usuarios) renderizarLista();
      }

      window.aceptarUsuario = (mail) => enviarAccion(mail, "Aceptado");
      window.rechazarUsuario = (mail) => enviarAccion(mail, "Rechazado");

      obtenerUsuarios();
    </script>
  </body>
</html>
