<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-texto="pagina.misincidencias">Mi cuadrilla - Epsilon</title>

    <link rel="stylesheet" href="style.css" />
    <script src="idiomas.js"></script>
  </head>

  <body>
    <script>
      {
        const rol = (localStorage.getItem("rol") || "").trim();
        const sinSesion =
          localStorage.getItem("logueado") !== "si" ||
          !localStorage.getItem("mail");

        if (sinSesion || !["Recolector"].includes(rol)) {
          document.documentElement.style.display = "none";
          window.location.replace(sinSesion ? "login.html" : "index.html");
        }
      }
    </script>

    <header>
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Epsilon" />
        </a>
      </div>

      <div class="header-actions">
        <div id="usuario" class="usuario"></div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      </div>

      <nav id="menu">
        <ul>
          <li>
            <button
              data-rol="Recolector"
              class="link-button"
              data-texto="menu.inicio"
              onclick="window.location.href = 'index.html'"
            >
              Inicio
            </button>
          </li>
          <li>
            <button
              class="link-button"
              data-texto="menu.mapa"
              onclick="window.location.href = 'mapa.html'"
            >
              Mapa
            </button>
          </li>
          <li>
            <button
              class="link-button"
              data-texto="menu.estadisticas"
              onclick="window.location.href = 'estadisticas.html'"
            >
              Estadísticas
            </button>
          </li>
          <li>
            <button
              class="link-button"
              data-texto="menu.documentacion"
              onclick="window.location.href = 'documentacion.html'"
            >
              Documentación
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <div class="pagina">
      <h2 data-texto="mis.titulo">Mi cuadrilla</h2>

      <p data-texto="mis.descripcion">
        Incidencias y rutas asignadas a tu cuadrilla.
      </p>

      <div class="lista-panel">
        <h3 data-texto="mis.incidencias">Incidencias</h3>
        <ul id="listaIncidencias">
          <p data-texto="mis.cargandoIncidencias">Cargando incidencias...</p>
        </ul>
      </div>

      <div class="lista-panel">
        <h3 data-texto="mis.rutas">Rutas</h3>
        <ul id="listaRutas">
          <p data-texto="mis.cargandoRutas">Cargando rutas...</p>
        </ul>
      </div>
    </div>

    <div
      class="overlay"
      id="overlayNoRecogido"
      onclick="cerrarNoRecogido(event)"
    >
      <div class="asignar-cuadrilla">
        <h3 data-texto="mis.tituloNoRecogido">Contenedor no recogido</h3>

        <form id="formNoRecogido">
          <label data-texto="mis.tipoIncidencia">Tipo de incidencia</label>
          <select id="tipoIncidenciaNoRecogido" required>
            <option
              value=""
              disabled
              selected
              data-texto="comun.seleccioneTipo"
            >
              Seleccione un tipo
            </option>
            <option value="incendiado" data-texto="tipoIncidencia.incendiado">
              Contenedor incendiado
            </option>
            <option value="rotura" data-texto="tipoIncidencia.rotura">
              Contenedor dañado
            </option>
          </select>

          <button
            class="btn-asignar-cuadrilla"
            type="submit"
            data-texto="mis.confirmar"
          >
            Confirmar
          </button>
          <button
            class="btn-cancelar-usuario"
            type="button"
            data-texto="comun.cancelar"
            onclick="cerrarNoRecogido()"
          >
            Cancelar
          </button>
        </form>
      </div>
    </div>

    <script>
      const API_URL =
        "http://localhost/Proyecto/ProyectoSyntropy/Gestion/miApi/Incidencias/";
      const API_URL_RUTAS =
        "http://localhost/Proyecto/ProyectoSyntropy/Recoleccion/miApi/Rutas/";
      let incidencias = null;
      let rutas = null;
      let paradasPorRuta = {};
      let paradaNoRecogida = null;

      document.addEventListener("DOMContentLoaded", () => {
        const rolUsuario = (localStorage.getItem("rol") || "").trim();
        document.querySelectorAll("[data-rol]").forEach((boton) => {
          const rolesPermitidos = boton.dataset.rol
            .split(",")
            .map((rol) => rol.trim());
          if (!rolesPermitidos.includes(rolUsuario)) {
            boton.style.display = "none";
          }
        });
      });

      function toggleMenu() {
        document.getElementById("menu").classList.toggle("activo");
      }

      function cerrarSesion() {
        localStorage.removeItem("logueado");
        localStorage.removeItem("rol");
        localStorage.removeItem("nickname");
        localStorage.removeItem("mail");

        window.location.href = "index.html";
      }

      function cargarUsuario() {
        const nombre =
          localStorage.getItem("nickname") || traducir("usuario.porDefecto");
        const inicial = nombre.charAt(0).toUpperCase();

        document.getElementById("usuario").innerHTML = `

      <span class="nombre-usuario">${nombre}</span>

      <button class="usuario-btn" onclick="abrirUsuario()">
          ${inicial}
      </button>

      <div id="menuUsuario" class="menu-usuario">

          <button onclick="cerrarSesion()">
              ${traducir("usuario.cerrarSesion")}
          </button>

      </div>

      `;
      }

      function abrirUsuario() {
        document.getElementById("menuUsuario").classList.toggle("activo");
      }

      cargarUsuario();

      function alCambiarIdioma() {
        cargarUsuario();
        if (incidencias) renderizarIncidencias();
        if (rutas) renderizarRutas();
      }

      async function obtenerIncidencias() {
        try {
          const datos = {
            mail: localStorage.getItem("mail"),
          };

          const resp = await fetch(`${API_URL}MisIncidencias`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          incidencias = Array.isArray(data) ? data : data?.data || [];
          renderizarIncidencias();
        } catch (error) {
          console.error("Error al obtener incidencias:", error);
          document.getElementById("listaIncidencias").innerHTML =
            `<p>${traducir("mis.errorIncidencias")}</p>`;
        }
      }

      async function obtenerRutas() {
        try {
          const datos = {
            mail: localStorage.getItem("mail"),
          };

          const resp = await fetch(`${API_URL_RUTAS}MisRutas`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          rutas = Array.isArray(data) ? data : data?.data || [];
          await Promise.all(rutas.map((ruta) => obtenerParadas(ruta.ID_ruta)));
          renderizarRutas();
        } catch (error) {
          console.error("Error al obtener rutas:", error);
          document.getElementById("listaRutas").innerHTML =
            `<p>${traducir("mis.errorRutas")}</p>`;
        }
      }

      async function marcarRealizada(id) {
        if (!confirm(traducir("mis.confirmarRealizada"))) return;
        try {
          const datos = {
            idIncidencia: id,
            mail: localStorage.getItem("mail"),
          };

          const resp = await fetch(`${API_URL}Realizada`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });
          const resultado = await resp.json();
          if (resultado.status === "ok") {
            obtenerIncidencias(); // refresca la lista
          } else {
            alert(mensajeStatus(resultado));
          }
        } catch (error) {
          console.error("Error al marcar la incidencia:", error);
          alert(traducir("comun.conexion"));
        }
      }

      // accion: "Iniciar" o "Finalizar"
      async function cambiarEstadoRuta(id, accion) {
        const confirmaciones = {
          Iniciar: "mis.confirmarIniciar",
          Finalizar: "mis.confirmarFinalizar",
        };
        if (!confirm(traducir(confirmaciones[accion]))) return;
        try {
          const datos = {
            idRuta: id,
            mail: localStorage.getItem("mail"),
          };

          const resp = await fetch(`${API_URL_RUTAS}${accion}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });
          const resultado = await resp.json();
          if (resultado.status === "ok") {
            obtenerRutas(); // refresca la lista
          } else {
            alert(mensajeStatus(resultado));
          }
        } catch (error) {
          console.error("Error al actualizar la ruta:", error);
          alert(traducir("comun.conexion"));
        }
      }

      function renderizarIncidencias() {
        const listaContainer = document.getElementById("listaIncidencias");

        if (incidencias.length === 0) {
          listaContainer.innerHTML = `<p>${traducir("mis.sinIncidencias")}</p>`;
          return;
        }

        let html = '<ul style="list-style: none; padding: 0; margin: 0;">';

        incidencias.forEach((incidencia) => {
          const realizada =
            (incidencia.estado || "").toLowerCase() === "terminada";

          html += `
<li class="incidencia-item">
  <div class="incidencia-cuerpo">
    ${
      incidencia.imagen
        ? `<img src="${incidencia.imagen}" alt="${traducir("mis.fotoIncidencia")}" class="incidencia-thumb" />`
        : ""
    }
    <div class="incidencia-info">
      <strong>#${incidencia.ID_incidencia} — ${traducirValor("tipoIncidencia", incidencia.tipo)}</strong>
      <span class="incidencia-estado">${traducirValor("estado", incidencia.estado)}</span>
      <p>${incidencia.calle} ${incidencia.numero}, ${incidencia.barrio}</p>
    </div>
  </div>
  <span class="incidencia-acciones">
    ${
      realizada
        ? ""
        : `<button class="btn-modificar" onclick="marcarRealizada(${incidencia.ID_incidencia})">
      ${traducir("mis.marcarRealizada")}
    </button>`
    }
  </span>
</li>`;
        });

        html += "</ul>";
        listaContainer.innerHTML = html;
      }

      function renderizarRutas() {
        const listaContainer = document.getElementById("listaRutas");

        if (rutas.length === 0) {
          listaContainer.innerHTML = `<p>${traducir("mis.sinRutas")}</p>`;
          return;
        }

        const hayEnCurso = rutas.some((ruta) => ruta.estado === "En Curso");
        let html = '<ul style="list-style: none; padding: 0; margin: 0;">';

        rutas.forEach((ruta) => {
          let boton = "";
          const sinIniciar = ["Planificada", "Pendiente"].includes(ruta.estado);
          if (sinIniciar && !hayEnCurso) {
            boton = `<button class="btn-modificar" onclick="cambiarEstadoRuta(${ruta.ID_ruta}, 'Iniciar')">${traducir("mis.iniciarRuta")}</button>`;
          } else if (ruta.estado === "En Curso") {
            boton = `<button class="btn-modificar" onclick="cambiarEstadoRuta(${ruta.ID_ruta}, 'Finalizar')">${traducir("mis.finalizarRuta")}</button>`;
          }

          html += `
<li class="incidencia-item rc-ruta-item">
  <div class="incidencia-cuerpo">
    <div class="incidencia-info">
      <strong>${ruta.nombre ? ruta.nombre : `${traducir("mis.ruta")} #${ruta.ID_ruta}`}</strong>
      <span class="incidencia-estado">${traducirValor("estado", ruta.estado)}</span>
      <p>${traducir("mis.iniciada")}: ${ruta.fecha_inicio ? ruta.fecha_inicio : "—"}</p>
      <p>${traducir("mis.finalizada")}: ${ruta.fecha_fin ? ruta.fecha_fin : "—"}</p>
    </div>
  </div>
  <span class="incidencia-acciones">${boton}</span>
  ${renderizarParadas(ruta)}
</li>`;
        });

        html += "</ul>";
        listaContainer.innerHTML = html;
      }
      async function obtenerParadas(idRuta) {
        try {
          const datos = {
            idRuta: idRuta,
            mail: localStorage.getItem("mail"),
          };

          const resp = await fetch(`${API_URL_RUTAS}Paradas`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          paradasPorRuta[idRuta] = data?.data || [];
        } catch (error) {
          console.error("Error al obtener los contenedores de la ruta:", error);
          paradasPorRuta[idRuta] = null;
        }
      }

      async function marcarParada(idParada, estado, tipoIncidencia = null) {
        try {
          const datos = {
            idParada: idParada,
            estado: estado,
            tipoIncidencia: tipoIncidencia,
            mail: localStorage.getItem("mail"),
          };

          const resp = await fetch(`${API_URL_RUTAS}MarcarParada`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });
          const resultado = await resp.json();
          if (resultado.status === "ok") {
            obtenerRutas();
            if (estado === "No recogido") obtenerIncidencias();
          } else {
            alert(mensajeStatus(resultado));
          }
        } catch (error) {
          console.error("Error al marcar el contenedor:", error);
          alert(traducir("comun.conexion"));
        }
      }

      function marcarRecogida(idParada) {
        if (!confirm(traducir("mis.confirmarRecogido"))) return;
        marcarParada(idParada, "Recogido");
      }

      function abrirNoRecogido(idParada) {
        paradaNoRecogida = idParada;
        document.getElementById("formNoRecogido").reset();
        document.getElementById("overlayNoRecogido").classList.add("activo");
      }

      function cerrarNoRecogido(evento) {
        if (!evento || evento.target.id === "overlayNoRecogido") {
          document
            .getElementById("overlayNoRecogido")
            .classList.remove("activo");
        }
      }

      document
        .getElementById("formNoRecogido")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const tipo = document.getElementById(
            "tipoIncidenciaNoRecogido",
          ).value;
          if (!tipo || !paradaNoRecogida) return;

          cerrarNoRecogido();
          await marcarParada(paradaNoRecogida, "No recogido", tipo);
        });

      function renderizarParadas(ruta) {
        const paradasRuta = paradasPorRuta[ruta.ID_ruta];

        if (!paradasRuta) {
          return `<div class="rc-paradas"><span class="rc-parada-dir">${traducir("mis.errorParadas")}</span></div>`;
        }

        if (paradasRuta.length === 0) {
          return `<div class="rc-paradas"><span class="rc-parada-dir">${traducir("mis.sinContenedores")}</span></div>`;
        }

        const clasesEstado = {
          Pendiente: "rc-estado-pendiente",
          Recogido: "rc-estado-ok",
          "No recogido": "rc-estado-no",
        };

        let html = '<div class="rc-paradas">';

        paradasRuta.forEach((parada) => {
          const marcable = ruta.estado === "En Curso" && parada.ID_contenedor;
          let botones = "";

          if (marcable && parada.estado !== "Recogido") {
            botones += `<button class="btn-asignar-cuadrilla" onclick="marcarRecogida(${parada.ID_parada})">${traducir("mis.marcarRecogido")}</button>`;
          }
          if (marcable && parada.estado !== "No recogido") {
            botones += `<button class="btn-no-recogido" onclick="abrirNoRecogido(${parada.ID_parada})">${traducir("mis.marcarNoRecogido")}</button>`;
          }

          html += `
<div class="rc-parada">
  <div class="rc-parada-info">
    <strong>${parada.orden}. ${traducir("mis.contenedor")} #${parada.ID_contenedor ?? "—"}${parada.tipo ? ` — ${traducirValor("tipoContenedor", parada.tipo)}` : ""}</strong>
    <span class="rc-parada-dir">${parada.calle ?? ""} ${parada.numero ?? ""}, ${parada.barrio ?? ""}</span>
  </div>
  <span class="op-badge ${clasesEstado[parada.estado] || "rc-estado-pendiente"}">${traducirValor("estado", parada.estado)}</span>
  <span class="rc-parada-acciones">${botones}</span>
</div>`;
        });

        html += "</div>";
        return html;
      }

      obtenerIncidencias();
      obtenerRutas();
    </script>
  </body>
</html>
