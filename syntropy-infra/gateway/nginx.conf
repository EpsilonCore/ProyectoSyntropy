# Redirect HTTP to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    ssl_certificate     /etc/nginx/certs/sigeru.crt;
    ssl_certificate_key /etc/nginx/certs/sigeru.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Enable HSTS only after HTTPS is permanently available with a valid certificate.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/usuarios    { return 308 /api/usuarios/; }
    location = /api/gestion     { return 308 /api/gestion/; }
    location = /api/recoleccion { return 308 /api/recoleccion/; }

    # Translate the public API prefixes to the legacy paths checked by each PHP API.
    location /api/usuarios/ {
        proxy_pass http://api-usuarios/Proyecto/ProyectoSyntropy/Usuarios/miApi/;
    }
    location /api/gestion/ {
        proxy_pass http://api-gestion/Proyecto/ProyectoSyntropy/Gestion/miApi/;
    }
    location /api/recoleccion/ {
        proxy_pass http://api-recoleccion/Proyecto/ProyectoSyntropy/Recoleccion/miApi/;
    }

    location / { proxy_pass http://landing; }
    location ~ ^/(login|registro|mapa|estadisticas|documentacion|misincidencias)\.html$ { proxy_pass http://frontend; }
    location ~ ^/(gestion|panel[a-z_]+)\.html$ { proxy_pass http://backoffice; }
    location ~ ^/(style\.css|idiomas\.js|logo\.png|contenedor\.png|fotocamion\.png)$ { proxy_pass http://landing; }
}
