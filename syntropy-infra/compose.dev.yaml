services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    networks: [sigeru_red]

  api-usuarios:
    volumes: ["../syntropy-api-usuarios:/var/www/html"]
    depends_on: { db: { condition: service_healthy } }

  api-gestion:
    volumes: ["../syntropy-api-gestion:/var/www/html"]
    depends_on: { db: { condition: service_healthy } }

  api-recoleccion:
    volumes: ["../syntropy-api-recoleccion:/var/www/html"]
    depends_on: { db: { condition: service_healthy } }

  backoffice:
    volumes: ["../syntropy-backoffice:/var/www/html"]
    depends_on: { db: { condition: service_healthy } }

volumes:
  mysql_data: