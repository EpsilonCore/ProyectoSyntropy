$kind: http-request
url: "{{baseUrl}}/Proyecto/ProyectoSyntropy/Usuarios/miApi/Login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mail": "{{adminMail}}",
      "contrasena": "{{adminPass}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login responde 200 y status 'ok'", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().status).to.eql('ok');
      });
    language: text/javascript
order: 1000
