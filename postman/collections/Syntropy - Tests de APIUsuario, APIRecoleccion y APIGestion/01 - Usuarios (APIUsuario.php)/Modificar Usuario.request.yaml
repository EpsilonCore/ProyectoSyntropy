$kind: http-request
url: "{{baseUrl}}/Proyecto/ProyectoSyntropy/Usuarios/miApi/Modificar"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mail": "{{mailUsuarioPrueba}}",
      "nombre": "Nombre Modificado",
      "rol": "Vecino"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("El rol de la sesión activa SI tiene permiso (no devuelve 403)", function () {
          pm.expect(pm.response.code).to.not.equal(403);
      });
    language: text/javascript
order: 7000
