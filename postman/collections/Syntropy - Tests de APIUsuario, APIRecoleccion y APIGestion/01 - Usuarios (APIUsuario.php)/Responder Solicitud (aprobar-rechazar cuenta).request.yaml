$kind: http-request
name: Responder Solicitud (aprobar/rechazar cuenta)
url: "{{baseUrl}}/Proyecto/ProyectoSyntropy/Usuarios/miApi/Actualizar"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mail": "{{mailUsuarioPrueba}}",
      "aprobado": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("El rol de la sesión activa SI tiene permiso (no devuelve 403)", function () {
          pm.expect(pm.response.code).to.not.equal(403);
      });
    language: text/javascript
order: 6000
