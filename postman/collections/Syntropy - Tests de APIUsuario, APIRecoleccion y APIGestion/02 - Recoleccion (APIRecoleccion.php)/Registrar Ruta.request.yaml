$kind: http-request
url: "{{baseUrl}}/Proyecto/ProyectoSyntropy/Recoleccion/miApi/Rutas/Registrar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ruta de Prueba Postman",
      "matriculaCamion": "{{matriculaPrueba}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("El rol de la sesión activa SI tiene permiso (no devuelve 403)", function () {
          pm.expect(pm.response.code).to.not.equal(403);
      });
    language: text/javascript
order: 8000
