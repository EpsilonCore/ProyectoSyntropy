$kind: http-request
url: "{{baseUrl}}/Proyecto/ProyectoSyntropy/Recoleccion/miApi/RegistrarCamion"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "matricula": "{{matriculaPrueba}}",
      "modelo": "Volvo FH",
      "capacidadKg": 8000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("El rol de la sesión activa SI tiene permiso (no devuelve 403)", function () {
          pm.expect(pm.response.code).to.not.equal(403);
      });
    language: text/javascript
order: 3000
