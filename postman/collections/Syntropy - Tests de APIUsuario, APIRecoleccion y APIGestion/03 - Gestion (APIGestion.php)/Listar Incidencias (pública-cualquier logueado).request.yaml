$kind: http-request
name: Listar Incidencias (pública/cualquier logueado)
url: "{{baseUrl}}/Proyecto/ProyectoSyntropy/Gestion/miApi/Incidencias/Incidencias"
method: GET
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          pm.test("Si la respuesta es 200, 'data' es un array", function () {
              const jsonData = pm.response.json();
              pm.expect(jsonData.data).to.be.an('array');
          });
      }
    language: text/javascript
order: 3000
